plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore/keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// Signing release hanya aktif bila keystore lokal tersedia (lihat android/PLAYSTORE-BUILD.md).
def hasReleaseSigning = keystorePropertiesFile.exists() && keystoreProperties.containsKey('storeFile')

android {
    namespace 'com.wzmanagepro.app'
    buildToolsVersion '36.0.0'
    compileSdk 36

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.wzmanagepro.app'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Tanpa keystore lokal, build release tetap jalan sebagai unsigned
            // (cukup untuk uji coba) alih-alih gagal karena signing config kosong.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
