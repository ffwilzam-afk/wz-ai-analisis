plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore/keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// Signing release hanya aktif bila keystore lokal tersedia (lihat android/PLAYSTORE-BUILD.md).
def hasReleaseSigning = keystorePropertiesFile.exists() && keystoreProperties.containsKey('storeFile')

// Minifikasi R8 aktif secara default. Bila ada fitur yang gagal setelah build
// rilis (misalnya cetak struk berhenti jalan), matikan dengan satu perintah:
//     ./gradlew bundleRelease -PwzShrink=false
def useShrink = !project.hasProperty('wzShrink') || project.property('wzShrink').toString() != 'false'

android {
    namespace 'com.wzmanagepro.app'
    buildToolsVersion '36.0.0'
    compileSdk 36

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // Play Console menolak AAB yang hanya ditandatangani v1 (JAR).
                v1SigningEnabled false
                v2SigningEnabled true
                v3SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId 'com.wzmanagepro.app'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled useShrink
            shrinkResources useShrink
            // Tanpa keystore lokal, build release tetap jalan sebagai unsigned
            // (cukup untuk uji coba) alih-alih gagal karena signing config kosong.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Play Console meminta Android App Bundle untuk rilis baru.
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
