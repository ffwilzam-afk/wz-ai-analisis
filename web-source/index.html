// Batas pesan yang ditahan di memori saat user BELUM memuat history lama.
// Setelah user menekan "Muat pesan lama", pesan yang sudah dia buka
// sengaja ditahan semua agar history tidak hilang dari layar.
const WZ_FORUM_MAX_HELD=80;
let wzForumOlderPinned=false;
// Pilihan lokal sebelum dikirim (khusus polling multi-pilih) dan mode "ubah
// pilihan" untuk polling yang sudah pernah divote. Keduanya sengaja disimpan
// di memori saja: setelah suara tersimpan, server yang jadi sumber kebenaran.
const WZ_POLL_MIN_OPTIONS=2;
const WZ_POLL_MAX_OPTIONS=20;
const WZ_POLL_MAX_QUESTION=300;
const WZ_POLL_MAX_LABEL=100;
let wzPollDraft={};
let wzPollEditing={};

function ownerForumInitials(name){
  const text=String(name||'').trim();
  if(!text)return '?';
  const parts=text.split(/\s+/).filter(Boolean);
  if(parts.length>=2)return (parts[0][0]+parts[1][0]).toUpperCase();
  return text.slice(0,2).toUpperCase();
}

// Avatar: Admin memakai logo aplikasi Android/APK, setiap Owner memakai
// avatar profil miliknya sendiri (dari wz_user_profiles via senderAvatar),
// dengan fallback inisial. Tidak pernah memakai avatar Owner lain.
function ownerForumAvatarHtml(m,isAdmin){
  if(isAdmin)return `<img src="${WZ_APP_LOGO}" alt="WZ MANAGE PRO">`;
  const avatar=String(m.senderAvatar||'').trim();
  if(avatar&&/^(https?:)?\/\/|data:image\//i.test(avatar))
    return `<img src="${avatar.replace(/"/g,'&quot;')}" alt="">`;
  return `<span class="owner-forum-initials">${escapeHtml(ownerForumInitials(m.senderName))}</span>`;
}

function ownerForumPreviewText(m){
  if(!m)return '';
  if(m.messageType==='sticker')return 'Sticker '+String(m.stickerId||'');
  return String(m.message||'').replace(/\s+/g,' ').trim();
}

/* ---- Polling -----------------------------------------------------------
   Polling adalah pesan forum biasa; yang membedakan hanya isi poll-nya.
   Semua data suara berasal dari server: bubble hanya menampilkan hasil yang
   sudah dikirim balik, sehingga tidak ada hitungan suara di frontend.

   Aturan main:
   - belum vote + single choice  -> mengetuk opsi langsung mengirim suara
   - belum vote + multi choice   -> centang dulu, lalu tekan "Kirim suara"
   - sudah vote + single choice  -> hasil tetap bisa diketuk untuk mengganti
   - sudah vote + multi choice   -> "Ubah pilihan" dulu, baru bisa dikirim  */
function ownerForumPollDraft(messageId){
  const key=String(Number(messageId));
  if(!wzPollDraft[key])wzPollDraft[key]=[];
  return wzPollDraft[key];
}

function ownerForumRefreshPollNode(messageId){
  const id=Number(messageId);
  const box=document.getElementById('ownerForumMessages');
  const node=box?box.querySelector('[data-wz-message="'+id+'"]'):null;
  const m=wzForumMessages.find(x=>Number(x.id)===id);
  // Hanya satu bubble yang diganti, jadi posisi scroll dan state composer
  // tidak terganggu.
  if(node&&m)node.outerHTML=ownerForumMessageHtml(m);
}

function ownerForumPollHtml(m){
  const poll=m.poll;
  if(!poll)return `<div class="owner-forum-text">${escapeHtml(m.message||'')}</div>`;

  const id=Number(m.id);
  const key=String(id);
  const options=Array.isArray(poll.options)?poll.options:[];
  const total=Number(poll.totalVotes)||0;
  const multi=!!poll.allowMultiple;
  const draft=wzPollDraft[key]||[];
  // Mode ubah hanya dipakai polling multi-pilih; single choice cukup
  // mengetuk baris hasil untuk mengganti suara.
  const editing=multi&&!!wzPollEditing[key];
  const pickMode=!poll.voted||editing;

  let rows='';
  if(pickMode&&multi){
    rows=options.map(o=>{
      const on=!!o.mine||draft.includes(String(o.id));
      return `<button type="button" class="owner-forum-poll-option${on?' mine':''}" aria-pressed="${on?'true':'false'}" onclick="ownerForumTogglePollOption(${id},'${o.id}')"><span class="owner-forum-poll-mark">${on?'\u2611':'\u2610'}</span>${escapeHtml(o.label)}</button>`;
    }).join('');
  }else if(pickMode){
    rows=options.map(o=>`<button type="button" class="owner-forum-poll-option" onclick="ownerForumVotePoll(${id},'${o.id}')" aria-label="Pilih ${escapeHtml(o.label)}">${escapeHtml(o.label)}</button>`).join('');
  }else{
    rows=options.map(o=>{
      const count=Number(o.votes)||0;
      const percent=total?Math.round(count/total*100):0;
      // Baris dengan 0 suara tetap diberi tinggi minimal, bukan hilang.
      const width=count?Math.max(percent,6):0;
      // Single choice: baris hasil tetap bisa diketuk untuk mengganti suara,
      // jadi dipakai elemen <button> agar bisa difokuskan. Multi choice tidak
      // bisa diketuk di mode hasil, jadi cukup <div>.
      const tag=multi?'div':'button';
      const tap=multi?'':` type="button" onclick="ownerForumVotePoll(${id},'${o.id}')" aria-label="Ubah pilihan ke ${escapeHtml(o.label)}"`;
      return `<${tag} class="owner-forum-poll-option${o.mine?' mine':''}"${tap}><div class="owner-forum-poll-value"><span>${o.mine?'<span class="owner-forum-poll-mark">\u25cf</span>':''}${escapeHtml(o.label)}</span><b>${count}</b></div><div class="owner-forum-poll-track"><i style="width:${width}%"></i></div></${tag}>`;
    }).join('');
  }

  // Tombol kaki hanya muncul kalau memang ada aksi. Single choice tidak
  // perlu "Batal" (belum ada suara untuk dibatalkan) dan tidak perlu
  // "Ubah pilihan" karena baris hasilnya sendiri yang bisa diketuk.
  let foot=`<span>${total} suara</span>`;
  if(pickMode&&multi){
    foot+=editing?'<button type="button" class="owner-forum-poll-link" onclick="ownerForumTogglePollEditing('+id+',0)">Batal</button>':'';
  }else if(!pickMode&&multi){
    foot+='<button type="button" class="owner-forum-poll-link" onclick="ownerForumTogglePollEditing('+id+',1)">Ubah pilihan</button>';
  }

  const submit=(pickMode&&multi&&draft.length)
    ? `<button type="button" class="owner-forum-poll-submit" onclick="ownerForumSubmitPoll(${id})">${poll.voted?'Perbarui pilihan':'Kirim suara'}</button>`
    : '';

  return `<div class="owner-forum-poll">
    <div class="owner-forum-poll-question">${escapeHtml(poll.question||m.message||'')}</div>
    <div class="owner-forum-poll-options">${rows}</div>
    <div class="owner-forum-poll-foot">${foot}</div>
    ${submit}
  </div>`;
}

async function ownerForumSendVote(m,optionIds){
  if(!m||!m.poll||!optionIds||!optionIds.length)return;
  const key=String(Number(m.id));
  try{
    const r=await window.api('owner-forum/polls/vote',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pollId:String(m.poll.id),optionIds:optionIds.map(String)})
    });
    if(!r.ok)throw new Error(r.error||'Suara gagal disimpan.');
    // Hasil dari server langsung dipasang ke pesan, lalu bubble-nya saja yang
    // digambar ulang. Auto-refresh yang berjalan tetap bisa mengoreksinya.
    if(r.poll)m.poll=r.poll;
    delete wzPollDraft[key];
    delete wzPollEditing[key];
    ownerForumRefreshPollNode(m.id);
  }catch(e){
    toast(e.message||'Suara gagal disimpan.',true);
  }
}

function ownerForumVotePoll(messageId,optionId){
  const m=wzForumMessages.find(x=>Number(x.id)===Number(messageId));
  if(!m||!m.poll)return Promise.resolve();
  return ownerForumSendVote(m,[String(optionId)]);
}

function ownerForumTogglePollOption(messageId,optionId){
  const draft=ownerForumPollDraft(messageId);
  const id=String(optionId);
  const at=draft.indexOf(id);
  if(at>=0)draft.splice(at,1);else draft.push(id);
  ownerForumRefreshPollNode(messageId);
}

function ownerForumSubmitPoll(messageId){
  const m=wzForumMessages.find(x=>Number(x.id)===Number(messageId));
  if(!m||!m.poll)return Promise.resolve();
  return ownerForumSendVote(m,(wzPollDraft[String(Number(messageId))]||[]).slice());
}

function ownerForumTogglePollEditing(messageId,on){
  const key=String(Number(messageId));
  const m=wzForumMessages.find(x=>Number(x.id)===Number(messageId));
  if(!m||!m.poll)return;
  if(Number(on)){
    wzPollEditing[key]=true;
    // Mulai dari suara yang sudah tersimpan, jadi "ubah" tidak menghapus
    // pilihan lama sebelum user menekan tombol kirim.
    wzPollDraft[key]=(m.poll.myOptionIds||[]).slice();
  }else{
    delete wzPollEditing[key];
    delete wzPollDraft[key];
  }
  ownerForumRefreshPollNode(messageId);
}

/* ---- Menu composer & form buat polling ---------------------------------
   Akses Polling lewat satu tombol bulat kecil di composer, lalu pilihan dari
   sheet. Tidak ada toolbar besar, dan tidak ada satu pun baris tambahan di
   atas area chat. */
async function ownerForumOpenMenu(){
  const choice=await wzSheet({
    title:'Obrolan Owner',
    subtitle:'Buat konten baru untuk forum Owner.',
    actions:[{icon:'📊',label:'Polling',value:'poll'}]
  });
  if(choice==='poll')ownerForumCreatePoll();
}

function ownerForumPollReadForm(root){
  const question=String((root.querySelector('#wzPollQuestion')||{}).value||'').trim();
  const options=[...root.querySelectorAll('[data-wz-poll-option]')].map(x=>String(x.value||'').trim());
  const allowMultiple=!!(root.querySelector('#wzPollMultiple')||{}).checked;
  // Validasi di frontend hanya demi umpan balik cepat; server mengulang
  // seluruh aturan ini dan tidak mempercayai apa pun yang dikirim browser.
  if(!question)return {error:'Pertanyaan polling wajib diisi.'};
  if(options.length>WZ_POLL_MAX_OPTIONS)return {error:'Polling maksimal memiliki '+WZ_POLL_MAX_OPTIONS+' pilihan.'};
  if(options.some(x=>!x))return {error:'Pilihan polling tidak boleh kosong.'};
  if(options.length<WZ_POLL_MIN_OPTIONS)return {error:'Polling minimal memiliki '+WZ_POLL_MIN_OPTIONS+' pilihan.'};
  const seen=new Set();
  for(const label of options){
    const key=label.toLowerCase();
    if(seen.has(key))return {error:'Pilihan polling harus berbeda satu sama lain.'};
    seen.add(key);
  }
  return {question,options,allowMultiple};
}

function ownerForumPollError(root,message){
  const box=root.querySelector('#wzPollError');
  if(!box)return;
  box.textContent=message;
  box.hidden=false;
}

function ownerForumPollSyncAddButton(root){
  const add=root.querySelector('#wzPollAddOption');
  if(!add)return;
  const full=root.querySelectorAll('[data-wz-poll-option]').length>=WZ_POLL_MAX_OPTIONS;
  add.hidden=full;
  add.disabled=full;
}

async function ownerForumSendPoll(question,options,allowMultiple){
  try{
    const r=await window.api('owner-forum/polls',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        question,
        options,
        allowMultiple,
        replyToId:wzForumReplyTo?wzForumReplyTo.id:null
      })
    });
    if(!r.ok)throw new Error(r.error||'Polling gagal dibuat.');
    ownerForumCancelReply();
    wzForumNewCount=0;
    const box=document.getElementById('ownerForumMessages');
    await ownerForumLoad({force:true});
    if(box)box.scrollTop=box.scrollHeight;
    toast('Polling dibuat.');
    return true;
  }catch(e){
    toast(e.message||'Polling gagal dibuat.',true);
    return false;
  }
}

async function ownerForumCreatePoll(){
  const field=(index)=>`<input class="input" data-wz-poll-option="1" type="text" maxlength="${WZ_POLL_MAX_LABEL}" placeholder="Pilihan ${index}" autocomplete="off" enterkeyhint="next" style="width:100%">`;
  const body=`
    <div id="wzPollForm">
      <label style="display:block;margin-bottom:11px">
        <span class="muted" style="display:block;margin-bottom:6px">Pertanyaan</span>
        <input id="wzPollQuestion" class="input" type="text" maxlength="${WZ_POLL_MAX_QUESTION}" placeholder="Tulis pertanyaan..." autocomplete="off" style="width:100%">
      </label>
      <span class="muted" style="display:block;margin-bottom:6px">Pilihan</span>
      <div id="wzPollOptions" class="owner-forum-poll-form">${field(1)}${field(2)}</div>
      <button type="button" id="wzPollAddOption" class="owner-forum-poll-link" style="margin-top:9px">+ Tambah pilihan</button>
      <label class="owner-forum-poll-check">
        <input id="wzPollMultiple" type="checkbox">
        <span>Izinkan pilih lebih dari satu</span>
      </label>
      <p id="wzPollError" class="owner-forum-poll-error" hidden></p>
    </div>`;

  const created=await wzModal({
    title:'Buat Polling',
    body,
    actions:[
      {label:'Batal',value:null},
      {label:'Buat',primary:true}
    ],
    onReady(root){
      const list=root.querySelector('#wzPollOptions');
      const add=root.querySelector('#wzPollAddOption');
      const question=root.querySelector('#wzPollQuestion');
      if(question)question.focus();
      ownerForumPollSyncAddButton(root);
      if(add)add.addEventListener('click',()=>{
        const count=list.querySelectorAll('[data-wz-poll-option]').length;
        if(count>=WZ_POLL_MAX_OPTIONS)return;
        const wrap=document.createElement('div');
        wrap.innerHTML=field(count+1);
        const input=wrap.firstElementChild;
        list.appendChild(input);
        ownerForumPollSyncAddButton(root);
        try{input.focus();}catch(e){}
      });
      // Tombol "Buat" ditangani sendiri supaya form yang belum valid TIDAK
      // menutup modal. stopPropagation menahan penutup bawaan wzModal.
      const submit=root.querySelector('[data-wz-action="1"]');
      if(!submit)return;
      submit.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        const data=ownerForumPollReadForm(root);
        if(data.error){ownerForumPollError(root,data.error);return}
        const box=root.querySelector('#wzPollError');
        if(box)box.hidden=true;
        submit.disabled=true;
        ownerForumSendPoll(data.question,data.options,data.allowMultiple).then(ok=>{
          if(ok)wzModalDismiss(true);
          else{
            submit.disabled=false;
            ownerForumPollError(root,'Polling gagal dibuat. Coba lagi.');
          }
        });
      });
    }
  });
  if(!created)return;
}

function ownerForumMessageHtml(m){
  const isAdmin=m.senderRole==='platform_admin'||m.senderRole==='admin';

  // Posisi bubble ditentukan dari identitas sesi yang sedang login
  // (wz_users.id dari auth), bukan dari nama display.
  const myId=String(currentUser?.id??'');
  const isMine=!isAdmin&&!!myId&&m.senderRole==='owner'&&String(m.senderId??'')===myId;

  const time=m.createdAt
    ? new Date(m.createdAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})
    : '';
  const edited=m.editedAt?'<span class="owner-forum-edited">diedit</span>':'';

  const content=m.messageType==='sticker'
    ? `<div class="owner-forum-sticker">${escapeHtml(m.stickerId||'😊')}</div>`
    : m.messageType==='poll'
      ? ownerForumPollHtml(m)
      : `<div class="owner-forum-text">${escapeHtml(m.message||'')}</div>`;

  const reply=m.replyToId?`<div class="owner-forum-reply-quote"><b>${escapeHtml(m.replySenderName||'Pesan')}</b><span>${escapeHtml(m.replyMessageType==='sticker'?('Sticker '+String(m.replyStickerId||'')):(m.replyMessage||'Pesan dihapus'))}</span></div>`:'';

  const reactions=Array.isArray(m.reactions)&&m.reactions.length
    ? `<div class="owner-forum-reactions">${m.reactions.map(r=>`<button type="button" class="owner-forum-reaction${r.mine?' mine':''}" onclick="ownerForumReact(${Number(m.id)},'${r.reaction}')" aria-label="Reaksi ${r.reaction}">${escapeHtml(r.reaction)} ${r.count}</button>`).join('')}</div>`
    : '';

  const name=isAdmin?WZ_ADMIN_FORUM_NAME:(m.senderName||'Owner');
  // Verified badge hanya untuk akun Admin Platform.
  const verified=isAdmin?WZ_ADMIN_VERIFIED_BADGE:'';
  const avatar=ownerForumAvatarHtml(m,isAdmin);

  return `
    <div class="owner-forum-message${isMine?' is-mine':' is-theirs'}${isAdmin?' is-admin':''}" data-wz-message="${Number(m.id)}">
      <div class="owner-forum-avatar">${avatar}</div>
      <div class="owner-forum-body">
        <div class="owner-forum-meta">
          <strong>${escapeHtml(name)}</strong>
          ${verified}
          <span>${time}${edited}</span>
          <button type="button" class="owner-forum-more" onclick="ownerForumActions(${Number(m.id)})" aria-label="Opsi pesan" title="Opsi pesan">⋯</button>
        </div>
        ${reply}
        ${content}
        ${reactions}
      </div>
    </div>
  `;
}

function ownerForumRenderList(box,messages,mode){
  const empty=wzForumSearchTerm
    ? '<div class="muted" style="padding:32px;text-align:center">Tidak ada pesan yang cocok.</div>'
    : '<div class="muted" style="padding:32px;text-align:center">Belum ada obrolan.</div>';
  const html=messages.length?messages.map(ownerForumMessageHtml).join(''):empty;
  const hash=wzForumHash(html);
  const changed=box.dataset.ownerForumHash!==hash;
  if(changed)box.dataset.ownerForumHash=hash;
  const prevTop=box.scrollTop;
  const prevHeight=box.scrollHeight;
  const pill=mode==='append'&&wzForumNewCount>0
    ? '<div class="owner-forum-newpill"><button type="button" onclick="ownerForumJumpNew()">↓ Pesan baru ('+wzForumNewCount+')</button></div>'
    : '';
  const more=mode!=='older'&&wzForumHasMore
    ? '<button type="button" class="owner-forum-loadmore" onclick="ownerForumLoadOlder()">Muat pesan lama</button>'
    : '';
  box.innerHTML=more+html+pill;
  if(mode==='older')box.scrollTop=prevTop+(box.scrollHeight-prevHeight);
  return changed;
}

async function ownerForumLoad(options={}){
  const box=document.getElementById('ownerForumMessages');
  if(!box)return;
  const force=options?.force===true;
  const older=Number(options?.before)||0;
  if(ownerForumLoadPromise&&!older)return ownerForumLoadPromise;
  if(older&&ownerForumLoadingOlder)return;
  if(ownerForumLoaded&&!force&&!older&&!wzForumSearchTerm)return;

  const wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90;
  const previousScroll=box.scrollTop;
  const request=(async()=>{
    try{
      const query=new URLSearchParams();
      query.set('limit','40');
      if(older)query.set('before',String(older));
      if(wzForumSearchTerm)query.set('q',wzForumSearchTerm);
      const r=await window.api('owner-forum/messages?'+query.toString());
      if(!r.ok)throw new Error(r.error||'Gagal memuat obrolan.');
      if(document.getElementById('ownerForumMessages')!==box)return null;

      const messages=Array.isArray(r.messages)?r.messages:[];
      wzForumHasMore=Boolean(r.hasMore);

      if(older){
        // Sisipkan pesan lama di atas tanpa kehilangan posisi scroll user.
        const known=new Set(wzForumMessages.map(x=>String(x.id)));
        const olderOnes=messages.filter(x=>!known.has(String(x.id)));
        wzForumOlderPinned=true;
        wzForumMessages=olderOnes.concat(wzForumMessages);
        ownerForumRenderList(box,wzForumMessages,'older');
      }else{
        // Auto-refresh menyatu, bukan mengganti: pesan lama yang sudah
        // dimuat lewat "Muat pesan lama" tidak boleh hilang dari layar.
        const byId=new Map(wzForumMessages.map(x=>[Number(x.id),x]));
        let added=0;
        for(const m of messages){
          const id=Number(m.id);
          if(byId.has(id))Object.assign(byId.get(id),m);
          else{byId.set(id,m);added++;}
        }
        const merged=[...byId.values()].sort((a,b)=>Number(a.id)-Number(b.id));
        // Kalau hasil server sama sekali tidak menyambung dengan yang kita
        // punya (mis. setelah ganti tenant), mulai ulang dari hasil server.
        const continuous=!wzForumMessages.length||messages.length===0||byId.has(Number(messages[0].id));
        const list=continuous
          ? (wzForumOlderPinned?merged:merged.slice(-WZ_FORUM_MAX_HELD))
          : messages;
        if(continuous&&wzForumMessages.length&&added&&!wasNearBottom)wzForumNewCount+=added;
        else if(!wzForumSearchTerm)wzForumNewCount=0;
        wzForumMessages=list;
        ownerForumRenderList(box,list,'append');
        if(wasNearBottom||wzForumSearchTerm||!wzForumMessages.length)box.scrollTop=box.scrollHeight;
        else box.scrollTop=previousScroll;
      }
      ownerForumLoaded=true;
      wzForumFetchedAt=Date.now();
      return messages;
    }catch(e){
      if(document.getElementById('ownerForumMessages')!==box)return null;
      if(!ownerForumLoaded)box.innerHTML='<div class="muted" style="padding:24px;text-align:center">Gagal memuat obrolan.</div>';
      ownerForumLoaded=false;
      toast(e.message||'Gagal memuat obrolan.',true);
      return [];
    }
  })();
  if(older){
    ownerForumLoadingOlder=true;
    try{return await request}
    finally{ownerForumLoadingOlder=false}
  }
  ownerForumLoadPromise=request;
  try{return await request}
  finally{if(ownerForumLoadPromise===request)ownerForumLoadPromise=null}
}

async function ownerForumCopyText(text){
  const value=String(text||'');

  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);toast('Teks pesan disalin.');return;}
  }catch(e){}
  // Fallback untuk WebView lama yang tidak mendukung Clipboard API.
  try{
    const ta=document.createElement('textarea');

    ta.setAttribute('readonly','');

    ta.style.opacity='0';

    ta.select();

      await ownerForumLoad({force:true});
      toast('Pesan dihapus.');

/* --- Auto-refresh tidak boleh menghapus isian form ----------------------

   apa pun.

   ke field yang sudah berubah), tapi MENYANDAI render di latar: kalau ada
   field yang isinya berbeda dari hasil render terakhir, atau user sedang

let wzFormBaseline='';
function wzFormSignature(){
  const root=document.getElementById('content');
  if(!root)return '';
  const parts=[];
  root.querySelectorAll('input,textarea,select').forEach((el,i)=>{
    const key=el.id||el.dataset.service||('f'+i);
    const value=(el.type==='checkbox'||el.type==='radio')?String(el.checked):String(el.value);
    parts.push(key+'='+value);
  });
  return parts.join('|');
}
function wzFormBusy(){
  const root=document.getElementById('content');
  if(!root)return false;
  // Sedang mengetik: jangan menggambar ulang, supaya kursor tidak hilang dan
  // keyboard di Android tidak ikut menutup.
  const active=document.activeElement;
  if(active&&root.contains(active)&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName))return true;
  // Ada isian yang diubah user: jangan menggambar ulang.
  return wzFormSignature()!==wzFormBaseline;
}
function wzBackgroundRender(){
  if(typeof render!=='function')return false;
  if(wzFormBusy())return false;
  render();
  return true;
}

<script>
/* WZ MANAGE PRO — FULL ONLINE BRIDGE
   Server/Neon is authoritative. No browser storage is used for business state. */
(function(){
'use strict';

async function api(path,options={}){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  try{
    const res=await fetch("/api/"+path,{
      credentials:"include",
      headers:{"Content-Type":"application/json",...(options.headers||{})},
      ...options,
      signal:controller.signal
    });
    const text=await res.text();
    let data=null;
    try{data=text?JSON.parse(text):null}catch{}
    if(!res.ok){
      const err=new Error(data?.error||data?.message||("HTTP "+res.status));
      // Kode dari server ikut dibawa supaya pemanggil bisa membedakan
      // "konflik" dari "langganan tidak aktif" dari "jaringan putus".
      err.code=data?.code||'';
      err.status=res.status;
      throw err;
    }
    return data;
  }catch(e){
    if(e?.name==="AbortError")throw new Error("Server tidak merespons. Silakan coba lagi.");
    throw e;
  }finally{
    clearTimeout(timeout);
  }
}
window.api=api;
window.WZOnlineEmployee={api};

// payrollSettings sengaja TIDAK ikut snapshot: sumbernya hanya endpoint
// payroll/settings dan payroll/employee. Begitu ikut di sini, autosave
// menuliskan salinan basi dan auto-refresh 30 detik memuatnya kembali,
// sehingga angka yang baru disimpan Owner berubah sendiri di layar.
const NON_BUSINESS_KEYS=new Set([
  'transactions','shiftReports','employees','notifications','payrollSettings','__onlineStateLoaded','__onlineStateSaving',
]);

function resetTenantState(){
  clearTimeout(saveTimer);
  appStateUpdatedAt=null;
  wzForumSeenAt=0;
  wzForumSeenSavedAt=0;
  wzForumReadSentAt=0;
  wzForumCheckedAt=0;
  wzForumFetchedAt=0;
  wzForumUnread=0;
  subscriptionViewCache=null;
  subscriptionViewPromise=null;
  subscriptionViewKey='';
  db.branches=[];
  db.employees=[];
  db.customers=[];
  db.services=[];
  db.transactions=[];
  db.shiftReports=[];
  db.expenses=[];
  db.attendance=[];
  db.notifications=[];
  wzReadNotificationIds.clear();
  wzForumMessages=[];
  wzForumReplyTo=null;
  wzForumHasMore=false;
  wzForumSearchTerm='';
  wzForumNewCount=0;
  wzForumOlderPinned=false;
  db.payrollSettings=null;
  db.profile={
    name:currentUser?.name||'',
    role:currentUser?.role||'',
    brand:'',
    focus:'',
    notificationSoundEnabled:true,
    analyticsPeriod:'7'
  };
}

// Status read notifikasi bersifat monotonik: sebuah notifikasi yang sudah
// pernah ditandai dibaca tidak boleh kembali jadi unread karena hasil load
// lama (yang masih berjalan saat user menekan "Tandai dibaca") menimpa state
// lokal. Server tetap sumber kebenaran untuk notifikasi baru, jadi notifikasi
// baru tetap muncul sebagai unread.
const wzReadNotificationIds=new Set();
function applyServerNotifications(list){
  if(!Array.isArray(list))return;
  const previous=new Map((db.notifications||[]).map(x=>[String(x.id??''),x]));
  const next=list.map(item=>{
    const id=String(item.id??'');
    const prev=previous.get(id);
    const read=Boolean(item.readAt||item.read)
      ||wzReadNotificationIds.has(id)
      ||Boolean(prev?.readAt||prev?.read);
    if(read)wzReadNotificationIds.add(id);
    return {...item,read};
  });
  const live=new Set(next.map(x=>String(x.id??'')));
  for(const id of Array.from(wzReadNotificationIds))if(!live.has(id))wzReadNotificationIds.delete(id);
  db.notifications=next;
}

async function hydrateAppState(){
  if(!currentUser || !['owner','manager','employee'].includes(currentUser.role))return false;
  // Jangan menimpa state lokal selagi ada simpan yang masih tertunda.
  // Auto-refresh (timer 30 detik, `visibilitychange`, FCM) bisa datang di
  // tengah jeda 250ms. Kalau diteruskan, `db` kembali ke versi server yang
  // belum memuat perubahan Owner, dan perubahan berikutnya menimpanya lagi.
  if(pendingSaveResolve)return false;
  try{
    const r=await api('app-state');
    const state=(r?.data&&typeof r.data==='object'&&!Array.isArray(r.data))?r.data:{};
    const hasState=Object.keys(state).length>0;
    if(hasState){
      // Jangan pernah biarkan app-state menimpa pengaturan gaji: blob itu
      // tidak punya salary yang valid. Diperoleh dari payroll/* saja.
      const clean={...state};
      delete clean.payrollSettings;
      const serverNotifications=Array.isArray(clean.notifications)?clean.notifications:null;
      Object.assign(db,normalizeDbState(clean));
      if(serverNotifications)applyServerNotifications(serverNotifications);
      const serverSeen=Date.parse((db.profile||{}).ownerForumSeenAt||'')||0;
      if(wzForumSeenAt>serverSeen){
        db.profile={...(db.profile||{}),ownerForumSeenAt:new Date(wzForumSeenAt).toISOString()};
      }else if(serverSeen){
        wzForumSeenAt=serverSeen;
      }
    }
    appStateUpdatedAt=r.updatedAt||null;
    db.__onlineStateLoaded=true;
    return hasState;
  }catch(e){
    console.warn('Online app-state load failed:',e.message||e);
    return false;
  }
}

let saveTimer=null;
let appStateUpdatedAt=null;
// Potret state saat ini, TANPA kunci yang bukan milik bisnis.
function appStateSnapshot(){
  const snapshot={};
  for(const [key,value] of Object.entries(db||{})){
    if(NON_BUSINESS_KEYS.has(key))continue;
    snapshot[key]=value;
  }
  return snapshot;
}
async function persistAppState(presetSnapshot,alreadyRetried){
  if(!currentUser || !['owner','manager'].includes(currentUser.role))return false;
  // Kalau ada snapshot yang sudah diambil sebelumnya, pakai itu. Ambil ulang
  // di sini justru berbahaya: lihat catatan di queueAppStateSave().
  const snapshot=presetSnapshot||appStateSnapshot();
  try{
    const saved=await api('app-state',{method:'PUT',body:JSON.stringify({data:snapshot,expectedUpdatedAt:appStateUpdatedAt})});
    appStateUpdatedAt=saved?.updatedAt||appStateUpdatedAt;
    const el=document.getElementById('saveState');
    if(el)el.textContent='● Tersimpan online';
    return true;
  }catch(e){
    // Konflik: ambil timestamp terbaru lalu kirim ulang snapshot yang SAMA.
    // Sebelumnya di sini dipanggil hydrateAppState() + render(), yang
    // menimpa perubahan Owner dengan versi server -- jadi konflik apa pun
    // berarti perubahan hilang, bukan sekadar gagal disimpan.
    if(e&&e.code==='STATE_CONFLICT'&&!alreadyRetried){
      try{
        const fresh=await api('app-state');
        appStateUpdatedAt=fresh?.updatedAt||null;
        return await persistAppState(snapshot,true);
      }catch(_){/* biarkan jatuh ke penanganan di bawah*/}
    }
    lastSaveError={message:String(e&&e.message||e),code:String(e&&e.code||''),status:Number(e&&e.status||0)};
    console.warn('Online app-state save failed:',e.message||e);
    const el=document.getElementById('saveState');
    if(el)el.textContent='● Belum tersimpan ke server';
    return false;
  }
}
let pendingSaveResolve=null;
function queueAppStateSave(){
  if(!currentUser || !['owner','manager'].includes(currentUser.role))return Promise.resolve(false);
  // Snapshot diambil DI SINI, saat Owner menekan dropdownnya, bukan saat timer
  // 250ms nanti berbunyi.
  //
  // Kenapa ini penting: ada tiga pemicu auto-refresh -- timer 30 detik,
  // `visibilitychange` setiap kali aplikasi dibuka lagi dari latar belakang,
  // dan FCM. Semuanya memanggil hydrate() yang menimpa `db` dengan state
  // server. Kalau salah satu datang di antara perubahan dan timer berbunyi,
  // perubahan itu hilang, dan lebih buruknya save yang tertunda menuliskan
  // nilai LAMA kembali ke server -- jadi perubahan benar-benar hilang
  // permanen, bukan hanya tidak tampil.
  const snapshot=appStateSnapshot();
  clearTimeout(saveTimer);
  if(pendingSaveResolve)pendingSaveResolve(false);
  return new Promise(resolve=>{

function applyBusinessData(data){

async function syncBusiness(){
  if(!currentUser)return false;
  try{
    const beforeTx=new Map((db.transactions||[]).map(x=>[String(x.id),x]));
    const beforeSh=new Map((db.shiftReports||[]).map(x=>[String(x.id),x]));
    const first=await api('business');
    const serverTx=Array.isArray(first?.transactions)?first.transactions:[];
    const serverSh=Array.isArray(first?.shiftReports)?first.shiftReports:[];
    const serverBranches=Array.isArray(first?.branches)?first.branches:[];
    const conflicts=[];
    const sameFields=(a,b,fields)=>fields.every(field=>{
      const left=String(a?.[field]??''),right=String(b?.[field]??'');
      return field==='date'?left.slice(0,10)===right.slice(0,10):left===right;
    });
    for(const t of serverTx){
      const local=beforeTx.get(String(t.id));
      if(local&&!sameFields(local,t,['date','customerId','serviceId','servicePrice','employeeId','total','payment','status','discount']))
        conflicts.push({type:'transaction',id:String(t.id),resolution:'server'});
    }
    for(const r of serverSh){
      const local=beforeSh.get(String(r.id));
      if(local&&!sameFields(local,r,['date','employeeId','shiftType','customers','openingCash','cash','qris','cashExpense','physicalCash','totalPayment','expectedCash','cashDifference','serviceTotal','productTotal','totalOmzet','note']))
        conflicts.push({type:'shiftReport',id:String(r.id),resolution:'server'});
    }
    applyBusinessData({
      transactions:serverTx,
      shiftReports:serverSh,
      branches:serverBranches,
      notifications:first?.notifications
    });
    if(conflicts.length&&typeof toast==='function')toast(`${conflicts.length} konflik data terdeteksi; versi server digunakan.`);
    wzBackgroundRender();
    return true;
  }catch(e){
    console.warn('Online business sync failed:',e.message||e);
    if(typeof toast==='function' && /401|Belum login/i.test(String(e.message||'')))toast('Sesi login sudah berakhir. Silakan login kembali.');
    return false;
  }
}

async function savePayrollSettings(){
  if(!currentUser || !['owner','manager'].includes(currentUser.role)){
    toast('Hanya Owner/Manager yang dapat mengubah pengaturan gaji.');
    return;
  }

  const baseSalaryEl=document.getElementById('prBaseSalary');
  const periodDayEl=document.getElementById('prPeriodDay');

  if(!baseSalaryEl || !periodDayEl){
    toast('Form Pengaturan Gaji tidak ditemukan.');
    return;
  }

  const baseSalary=Number(baseSalaryEl.value);
  const periodStartDay=Number(periodDayEl.value);

  if(!Number.isFinite(baseSalary) || baseSalary<0){
    toast('Gaji pokok tidak valid.');
    return;
  }

  if(!Number.isInteger(periodStartDay) || periodStartDay<1 || periodStartDay>31){
    toast('Tanggal periode tidak valid.');
    return;
  }

  // Semua kategori punya ambang. Nilai 0 sah dan harus terkirim apa adanya,
  // bukan diganti bawaan.
  const serviceRules={};
  for(const c of PAYROLL_CATEGORIES){
    const t=document.getElementById('prTh_'+c.key)?.value;
    const b=document.getElementById('prBo_'+c.key)?.value;
    const threshold=Number(t),bonus=Number(b);
    if(t!==undefined&&(!Number.isInteger(threshold)||threshold<0||threshold>100000)){
      toast('Ambang '+c.label+' tidak valid.');
      return;
    }
    if(b!==undefined&&(!Number.isFinite(bonus)||bonus<0||bonus>1e9)){
      toast('Bonus '+c.label+' tidak valid.');
      return;
    }
    serviceRules[PAYROLL_SERVER_KEY[c.key]]={
      threshold:Number.isFinite(threshold)?threshold:PAYROLL_CATEGORY_DEFAULT[c.key].threshold,
      bonus:Number.isFinite(bonus)?bonus:PAYROLL_CATEGORY_DEFAULT[c.key].bonus
    };
  }

  try{
    const r=await api('payroll/settings',{
      method:'POST',
      body:JSON.stringify({
        payrollType:'BASE_PLUS_SERVICE_BONUS',
        baseSalary,
        targetAmount:Number(db.payrollSettings?.targetAmount)||0,
        periodStartDay,
        periodEndDay:periodStartDay,
        serviceRules
      })
    });

    if(!r?.ok || !r?.settings){
      throw new Error(r?.error||'Server tidak mengembalikan pengaturan gaji.');
    }

    const employees=db.payrollSettings?.employees||{};
    db.payrollSettings=payrollSettingsFromServer(r.settings);
    db.payrollSettings.employees=employees;

    toast('Pengaturan umum gaji berhasil disimpan.');
    render();
  }catch(e){
    console.warn('Save payroll settings failed:',e);
    toast('Gagal menyimpan pengaturan gaji: '+(e.message||e));
  }
}

async function fullHydrate(){
  if(!currentUser)return false;
  if(currentUser.role==='employee')unregisterPushSubscription().catch(()=>{});
  else if(typeof Notification!=='undefined'&&Notification.permission==='granted')registerPushSubscription().catch(()=>{});
  await hydrateAppState();

  try{
    const r=await api('profile');
    currentUser={...currentUser,...(r?.user||{}),...(r?.profile||{})};
  }catch{}

  if(['owner','manager'].includes(currentUser.role)){
    await syncEmployeesFromServer();
    await syncPayrollSettingsFromServer();
    // Badge "Gaji kustom" di halaman Karyawan bergantung pada ini, jadi harus
    // ikut termuat saat aplikasi dibuka, bukan hanya saat halaman Pengaturan
    // Gaji dibuka.
    await syncEmployeePayrollFromServer();
  }else{
    const employeeSynced=await syncMyEmployeeFromServer();
    if(!employeeSynced){
      throw new Error('Gagal mengambil data karyawan dari server: '+(window.__WZEmployeeSyncError||'error tidak diketahui'));
    }
  }

  await syncNativeFcmToken();
  if(!window.WZNativeFcmToken){
    setTimeout(()=>{
      if(window.WZNativeFcmToken&&currentUser)syncNativeFcmToken().catch(()=>{});
    },5000);
  }

  const businessSynced=await syncBusiness();
  if(!businessSynced){
    throw new Error('Gagal memuat data bisnis dari server.');
  }
  return true;
}

async function syncMyEmployeeFromServer(){

    if(!se)return false;

    const mapped={
      id:se.id,
      name:se.name,
      role:se.role||'Barber',
      branchId:se.branchId||null,
      salary:Number(se.salary)||0,
      commission:Number(se.commission)||0,
      target:Number(se.target)||0,
      attendance:Number(se.attendance)||0,
      eval:Number(se.eval)||0,
      active:se.active!==false
    };

    if(!Array.isArray(db.employees))db.employees=[];
    const idx=db.employees.findIndex(e=>String(e.id)===String(mapped.id));

    if(idx>=0)db.employees[idx]=mapped;
    else db.employees.push(mapped);

    queueAppStateSave();
    return true;
  }catch(e){
    console.error('Online my-employee sync failed:',e.message||e);
    window.__WZEmployeeSyncError=String(e?.message||e||'Unknown error');

  }
}

    window.WZOnlineSync?.reset?.();
    wzForumSeenSavedAt=0;wzForumReadSentAt=0;wzForumUnread=0;wzForumCheckedAt=0;wzForumFetchedAt=0;

const legacySaveEmployee=window.saveEmployee;
window.saveEmployee=async function(id){
  if(!guard('employees'))return;
  const name=(document.getElementById('eName')?.value||'').trim();
  const role=document.getElementById('eRole')?.value||'Barber';
  const password=(document.getElementById('ePassword')?.value||'').trim();
  const branchId=document.getElementById('eBranch')?.value||'';
  const salary=Number(document.getElementById('eSalary')?.value||0);
  const target=Number(document.getElementById('eTarget')?.value||0);
  if(!name)return peringatan('Isi nama karyawan');
  if(!password)return peringatan('Isi password login');
  if(!branchId)return peringatan('Pilih cabang karyawan');
  let employeeId=id||'';
  if(!employeeId){
    const next=Math.max(0,...(db.employees||[]).map(x=>Number(String(x.id).replace(/\D/g,''))||0))+1;
    employeeId='E'+String(next).padStart(3,'0');
  }
  const username=(name.trim().toLowerCase().replace(/[^a-z0-9]+/g,''))||'employee';
  try{
    // Saat membuat baru, ID di atas hanya saran. wz_employees.id itu PRIMARY KEY
    // global untuk semua bisnis, jadi kalau ID yang sama sudah dipakai bisnis
    // lain, server membuat ID sendiri. Karena itu WAJIB memakai employee.id
    // yang dikembalikan server, bukan tebakan lokal.
    const result=await api('employees',{method:id?'PUT':'POST',body:JSON.stringify({id:employeeId,name,role,password,username,branchId,salary,target})});
    if(!result?.employee||!result.employee.id)
      throw new Error('Server tidak menyimpan karyawan. Silakan coba lagi.');
    employeeId=result.employee.id;
    {
      const existing=(db.employees||[]).find(e=>e.id===result.employee.id);
      if(existing)Object.assign(existing,result.employee); else db.employees.push(result.employee);
    }
    if(typeof window.WZOnlineEmployee?.syncEmployeesFromServer==='function'){
      await window.WZOnlineEmployee.syncEmployeesFromServer();
    }
    closeModal();
    toast(id?'Data karyawan & akun online diperbarui.':'Karyawan & akun login online dibuat.');
  }catch(e){peringatan('Gagal menyimpan ke server: '+e.message);}
  void legacySaveEmployee;
};

  const employeeId=currentUser?.role==='employee'?(currentUser.employeeId||''):(employeeEl?.value||'');

async function markServerNotificationRead(id){
  const key=String(id);
  const item=(db.notifications||[]).find(x=>String(x.id)===key);
  if(!item)return;
  // Tandai sticky lebih dulu supaya load yang sedang berjalan tidak revive badge.
  wzReadNotificationIds.add(key);
  item.read=true;
  try{
    // Persist ke server dulu, baru state frontend dipakai sebagai sumber tampil.
    const r=await api('notifications/read',{method:'POST',body:JSON.stringify({id:key})});
    if(typeof r?.updatedAt==='string')appStateUpdatedAt=r.updatedAt;
    if(Array.isArray(r?.notifications))applyServerNotifications(r.notifications);
    else item.read=true;
    render();
  }catch(e){
    wzReadNotificationIds.delete(key);
    item.read=false;
    render();
    toast('Notifikasi belum bisa ditandai dibaca: '+e.message,true);
  }
}
async function markAllServerNotificationsRead(){
  const keys=(db.notifications||[]).map(x=>String(x.id??'')).filter(Boolean);
  keys.forEach(key=>wzReadNotificationIds.add(key));
  (db.notifications||[]).forEach(x=>{x.read=true});
  try{
    const r=await api('notifications/read',{method:'POST',body:JSON.stringify({all:true})});
    if(typeof r?.updatedAt==='string')appStateUpdatedAt=r.updatedAt;
    if(Array.isArray(r?.notifications))applyServerNotifications(r.notifications);
    else (db.notifications||[]).forEach(x=>{x.read=true});
    render();
  }catch(e){
    (db.notifications||[]).forEach(x=>{if(keys.includes(String(x.id??'')))x.read=false});
    render();
    toast('Notifikasi belum bisa ditandai dibaca: '+e.message,true);
  }
}

/* ---- Ukuran kertas struk untuk printer thermal (58mm / 80mm) ----
   Dipakai oleh halaman Pengaturan (script #1) dan dialog nota (script #2),
   karena itu helper-nya sengaja dibuat sebagai fungsi global. */
function receiptPaperSpec(){
  const code=String(window.__wzReceiptPaper||db.profile?.receiptPaper||'80')==='58'?'58':'80';
  return code==='58'
    ? {code:'58',label:'58mm',content:'48mm',font:'10px'}
    : {code:'80',label:'80mm',content:'72mm',font:'11px'};
}
function applyReceiptPaper(){
  const spec=receiptPaperSpec(),root=document.documentElement;
  root.style.setProperty('--wz-receipt-width',spec.content);
  root.style.setProperty('--wz-receipt-font',spec.font);
  return spec;
}
function setReceiptPaper(value){
  window.__wzReceiptPaper=String(value)==='58'?'58':'80';
  if(currentUser&&['owner','manager'].includes(currentUser.role)){
    db.profile=db.profile||{};
    db.profile.receiptPaper=window.__wzReceiptPaper;
    save();
  }
  const spec=applyReceiptPaper();
  toast('Ukuran kertas struk diset '+spec.label+'.');
}

// Auto-refresh: sinkronisasi seluruh data online.
// hydrateAppState/syncBusiness berada di dalam IIFE bridge, jadi harus lewat
// window.WZOnlineSync. Sebelumnya dipanggil langsung sehingga selalu gagal
// dengan ReferenceError yang tertelan try/catch (auto-refresh tidak jalan).
async function refreshAppData(){
  if(!currentUser)return false;
  try{
    const bridge=window.WZOnlineSync;
    if(!bridge)return false;
    await bridge.hydrate();
    await bridge.business();
    // Pengaturan gaji ikut disegarkan di sini. Kalau tidak, perubahan gaji
    // yang dibuat di perangkat lain baru terlihat setelah aplikasi dibuka
    // ulang, dan angka di layar terlihat "tidak benar-benar tersimpan".
    if(currentUser && ['owner','manager'].includes(currentUser.role)){
      await window.WZOnlinePayroll?.settings?.();
      await window.WZOnlinePayroll?.employee?.();
    }
    wzBackgroundRender();
    return true;
  }catch(e){
    // Sengaja tanpa log: auto-refresh berjalan otomatis di latar belakang,
    // sehingga pesan diagnostik hanya menambah kebisingan.
    return false;
  }
}

// Auto-refresh: polling setiap 30 detik
setInterval(()=>{
  if(currentUser){
    refreshAppData().catch(()=>{});
  }
},30000);

// Auto-refresh: saat app kembali ke foreground
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&currentUser){
    refreshAppData().catch(()=>{});
  }
});

// Auto-refresh: saat FCM masuk foreground via WZOnlineFcm
const _origFcmSync=window.WZOnlineFcm&&window.WZOnlineFcm.sync;
window.WZOnlineFcm={
  sync:function(){
    if(_origFcmSync)_origFcmSync();

};

// Retry FCM token sync sampai berhasil (max 10 menit)
(function retryFcmTokenSync(){
  let attempts=0;
  const MAX=20;
  const INTERVAL=30000;
  function trySync(){
    if(attempts>=MAX)return;
    // Tanpa bridge native (browser biasa) tidak akan pernah ada token,
    // jadi jangan mengulang penjadwalan terus-menerus.
    if(!('WZAndroid' in window))return;
    attempts++;
    if(!window.WZNativeFcmToken||!currentUser){
      setTimeout(trySync,INTERVAL);
      return;
    }
    syncNativeFcmToken().then(ok=>{
      if(!ok)setTimeout(trySync,INTERVAL);
    }).catch(()=>setTimeout(trySync,INTERVAL));
  }
  setTimeout(trySync,10000);
})();

<script>
/* NATIVE FEEL: tekan-tahan pada teks biasa tidak memunculkan sorotan,
   salin, atau menu konteks. Kolom isian dikecualikan supaya masih bisa
   diedit dan disalin. Penjaga ini ditulis setelah script utama karena
   `tests/ui-audit.test.js` menghitung urutan script dari <script> pertama
   sampai IIFE bridge. */
(function(){
  var SELECTABLE='input,textarea,select,option,[contenteditable=""],[contenteditable="true"],[contenteditable="plaintext-only"],.wz-copyable';
  function isSelectable(node){
    if(!node||!node.closest) return false;
    return !!node.closest(SELECTABLE);
  }
  function block(event){
    if(!isSelectable(event.target)) event.preventDefault();
  }
  ['contextmenu','dragstart','selectstart'].forEach(function(type){
    document.addEventListener(type,block,false);
  });
})();
</script>
