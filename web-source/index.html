/* Mobile bottom navigation */

.wz-top-icon{

  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  cursor:pointer;
  padding:0;
}

.wz-top-icon:hover{
  background:rgba(214,168,79,.10);
  color:#f4d98b;
}

.wz-top-icon{position:relative}
.payroll-cat-block{padding:12px 0;border-bottom:1px solid #20242b}.payroll-cat-block:last-child{border-bottom:0}
.wz-gold-glyph{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(214,168,79,.45))}
.hamb .wz-gold-glyph{width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(214,168,79,.5))}
.wz-bottom-nav button .nav-icon{height:22px;display:inline-flex;align-items:center;justify-content:center}
.wz-bottom-nav button .nav-icon .wz-gold-glyph{width:22px;height:22px;stroke-width:1.65;filter:drop-shadow(0 0 4px rgba(214,168,79,.32))}
.wz-bottom-nav button.active .nav-icon .wz-gold-glyph{color:#f4d98b;filter:drop-shadow(0 0 7px rgba(239,208,120,.72))}
.wz-bottom-nav button.active::after{content:"";position:absolute;left:50%;bottom:2px;width:28px;height:2px;transform:translateX(-50%);border-radius:99px;background:#efd078;box-shadow:0 0 8px rgba(239,208,120,.8)}
.wz-badge{position:absolute;top:1px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ef5350;color:#fff;font:800 10px/18px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px #090b0e;pointer-events:none}
.wz-top-avatar{width:40px;height:40px;padding:0}

.wz-top-avatar .wz-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.wz-top-avatar .wz-online-dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#38c76a;border:2px solid #090b0e;box-shadow:0 0 6px rgba(56,199,106,.55)}

}

    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1200;
    height:68px;
    display:flex;
    align-items:stretch;
    justify-content:space-around;
    background:rgba(12,14,18,.98);
    border-top:1px solid #292d35;
    box-shadow:0 -8px 24px rgba(0,0,0,.35);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .wz-bottom-nav button{
    position:relative;
    flex:1;
    min-width:0;
    border:0;
    background:transparent;
    color:#858b95;

    flex-direction:column;

    justify-content:center;

  .wz-bottom-nav button .nav-label{

  }

  .main{

  }

  /* Tombol "Keluar" ada di dasar sidebar (menu geser dari tombol hamburger).
     Bottom nav punya z-index 1200 dan menutup 68px paling bawah layar, jadi
     sidebar diberi ruang bawah yang sama -- sebelumnya tombol keluar tertutup
     bar ikon dan tidak bisa disentuh di Android. */
  .sidebar{
    padding-bottom:calc(68px + env(safe-area-inset-bottom));
  }

  /* Snackbar ikut tertutup bar ikon: naikkan ke atas bottom nav. */

    left:14px;

    bottom:calc(68px + 14px + env(safe-area-inset-bottom));

/* ===== TAMPILAN KHUSUS LAYAR KECIL (Android) =============================
   Tabel berubah jadi kartu, dan grid dashboard dilonggarkan supaya tidak
   berdesakan di HP 360px. Detail breakpoint ada di
   tests/responsive-tables.test.js. */
@media(max-width:600px){
  .table-wrap{overflow:visible}
  .table-wrap table{min-width:0;width:100%;display:block}
  .table-wrap thead{display:none}
  .table-wrap tbody{display:block}
  /* Section .card membungkus tabel: di mode kartunya dilepas supaya
     tidak jadi kartu di dalam kartu. */
  .table-wrap.card{background:none;border:0;padding:0;box-shadow:none}
  .table-wrap tbody tr{
    display:block;background:#0b0e12;border:1px solid #232830;
    border-radius:12px;margin:0 0 10px;padding:2px 12px;
  }
  .table-wrap tbody tr:last-child{margin-bottom:0}
  .table-wrap tbody tr.wz-card-summary{
    background:none;border:0;border-radius:0;padding:0;margin:0;
  }
  .table-wrap tbody tr.wz-card-summary td{
    display:block;text-align:center;color:var(--muted);border-bottom:0;
    padding:14px 0;font-size:12px;
  }
  .table-wrap tbody tr.wz-card-summary td::before{content:none}
  .table-wrap tbody tr.wz-card-summary.historical-total{
    background:#12161c;border:1px solid #232830;border-radius:10px;
    margin-top:6px;padding:2px 12px;
  }
  .table-wrap tbody tr.wz-card-summary.historical-total td{
    text-align:left;color:var(--text);font-weight:700;
  }
  .table-wrap td{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding:9px 0;border-bottom:1px solid #191d23;font-size:13px;text-align:right;
  }
  .table-wrap tbody tr td:last-child{border-bottom:0}
  .table-wrap td::before{
    content:attr(data-wz-th);flex:0 0 auto;max-width:46%;
    color:var(--muted);font-size:10px;text-transform:uppercase;
    letter-spacing:.08em;text-align:left;
  }
  /* Kolom yang headed-nya kosong (mis. tombol aksi) tidak diberi label. */
  .table-wrap td:not([data-wz-th]){justify-content:flex-end}

  .quick-grid{grid-template-columns:repeat(3,1fr)}
  .quick{padding:12px 6px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:13px}
  .kpi-value{font-size:20px}
  .section-head{flex-direction:column;align-items:stretch;gap:12px}
  .section-head>.btn{width:100%}
  .detail-grid{grid-template-columns:repeat(2,1fr)}
  .toolbar input,.toolbar select{min-width:0;flex:1 1 100%}
}
@media(max-width:380px){
  .quick-grid{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:1fr}
  .kpi-value{font-size:18px}
  .table-wrap tbody tr{padding:2px 10px}
}

/* Teks pesan pada dialog konfirmasi/peringatan. */
.dialog-text{color:#c7ccd3;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.dialog-text+.dialog-actions{margin-top:18px}

/* NATIVE FEEL: tekan-tahan tidak menyeleksi teks.
   APK Android memakai WebView, jadi tanpa aturan ini semua teks di layar
   bisa disorot dan disalin sehingga aplikasi terasa seperti situs.
   `user-select` bersifat diwarisi, jadi cukup dipasang pada container
   aplikasi; kolom isian dikembalikan ke `text` di bawah supaya tetap
   bisa diedit dan disalin seperti aplikasi biasa. */
html,body,#wzStartupLoading,.login-screen,#mainApp,.wz-bottom-nav,.modal,.toast{
 -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
 -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent
}
input,textarea,select,option,[contenteditable=""],[contenteditable="true"],[contenteditable="plaintext-only"],.wz-copyable{
 -webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;
 -webkit-touch-callout:default
}

/* Menu geser di HP: layar di luar menu diberi penedup (scrim) supaya
   mengetuk di luar jelas menutup menu, bukan seperti perilaku halaman web.
   z-index 19: di atas konten (topbar 10, main), di bawah sidebar (20)
   dan di bawah modal (300). */
.wz-scrim{display:none;position:fixed;inset:0;background:#000000a8;z-index:19}
.wz-scrim.on{display:block}
@media(max-width:800px){.wz-scrim.on{animation:wzScrimIn .15s ease-out}}
@keyframes wzScrimIn{from{opacity:0}to{opacity:1}}

/* Status perintah yang sedang jalan.
   Di HP indikator "Tersimpan online" di topbar disembunyikan (kelas
   .wz-top-hidden), jadi tanpa ini tidak ada apa pun yang memberi tahu
   pengguna bahwa tombol yang ditekan masih bekerja di server. */
.wz-busy{position:relative;pointer-events:none;color:transparent!important;text-shadow:none!important}
.wz-busy>*{visibility:hidden}
.wz-busy::before{
 content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-8px 0 0 -8px;
 border:2px solid #ffffff4d;border-top-color:#fff;border-radius:50%;animation:wzSpin .65s linear infinite
}
@keyframes wzSpin{to{transform:rotate(360deg)}}
.wz-net{
 position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:1300;
 display:flex;align-items:center;gap:9px;max-width:calc(100% - 28px);
 padding:9px 15px;border-radius:99px;background:#12161cf2;border:1px solid #6d5a24;
 color:#e8e9eb;font-size:12px;box-shadow:var(--shadow);pointer-events:none
}
.wz-net[hidden]{display:none}
.wz-net.err{border-color:#8a3b3b;color:#ffc9c9}
.wz-net-spin{
 width:13px;height:13px;flex:none;border:2px solid #ffffff40;border-top-color:var(--gold2);
 border-radius:50%;animation:wzSpin .65s linear infinite
}
.wz-net.err .wz-net-spin{border-top-color:#ff9b9b}
.wz-net-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:800px){.wz-net{bottom:calc(68px + 14px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.wz-busy::before,.wz-net-spin{animation-duration:1.6s}}
</style>

function pushKeyBytes(value){
 const padding='='.repeat((4-value.length%4)%4),base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(base64),bytes=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 return bytes;
}
async function registerPushSubscription(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||Notification.permission!=='granted')return false;
 try{
  const response=await fetch('/api/push/vapid-public-key',{credentials:'include'});
  if(!response.ok)return false;
  const data=await response.json(),registration=await navigator.serviceWorker.ready;
  const subscription=await registration.pushManager.getSubscription()||await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKeyBytes(data.publicKey)});
  const saved=await fetch('/api/push/subscribe',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(subscription)});
  return saved.ok;
 }catch(error){console.debug('Registrasi Web Push tidak tersedia.',error);return false}
}
async function unregisterPushSubscription(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return false;
  try{
    const registration=await navigator.serviceWorker.ready;
    const subscription=await registration.pushManager.getSubscription();
    if(!subscription)return false;
    const response=await fetch('/api/push/unsubscribe',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:subscription.endpoint})});
    return response.ok;
  }catch{return false}
}
function notifyAndroid(message,notificationId){

   title:ANDROID_NOTIFICATION_TITLE,
   message:String(message),

   timestamp:Date.now(),

}

// boleh pernah sampai ke pengguna: tidak lewat toast, tidak lewat suara,
// dan tidak lewat notifikasi Android. Fungsi push/FCM sendiri tetap berjalan

function isPushDiagnostic(message){

function toast(message,silent=false,notificationId){

}
function speakNotification(message){
 if(db?.profile?.notificationSoundEnabled===false||!('speechSynthesis' in window))return;
 try{window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(String(message));utterance.lang='id-ID';utterance.rate=.95;utterance.pitch=1;if('volume' in utterance)utterance.volume=1;window.speechSynthesis.speak(utterance)}catch(e){console.debug('Suara nama notifikasi tidak tersedia.',e)}
}
function playNotificationSound(){
 if(db?.profile?.notificationSoundEnabled===false)return;
 try{
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  if(!AudioContext)return;
  const ctx=window.__wzAudioContext||(window.__wzAudioContext=new AudioContext());
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();

}

const wzNet={count:0,failedAt:0,label:'',holdUntil:0};
window.wzNetStatus=wzNet;
function wzNetPaint(){
 const el=document.getElementById('wzNet');
 if(!el)return;
 const holding=wzNet.holdUntil>Date.now();
 const text=document.getElementById('wzNetText');
 if(text)text.textContent=holding&&wzNet.count===0?'Gagal menyimpan. Periksa koneksi.':(wzNet.label||'Menyimpan...');
 el.hidden=wzNet.count<1&&!holding;
 el.classList.toggle('err',wzNet.failedAt>0&&Date.now()-wzNet.failedAt<6000);
}
function wzNetBegin(label){
 if(label)wzNet.label=label;
 wzNet.count++;
 wzNetPaint();
}
function wzNetEnd(ok){
 wzNet.count=Math.max(0,wzNet.count-1);
 if(!ok){
  wzNet.failedAt=Date.now();
  // Permintaan terakhir yang gagal tidak boleh langsung hilang: kalau
  // pilnya lenyap begitu saja, pengguna mengira simpanannya berhasil.
  if(wzNet.count===0){
   wzNet.holdUntil=Date.now()+1800;
   setTimeout(wzNetPaint,1900);
  }
 }
 wzNetPaint();
}
/* Semua panggilan API melewati fetch, jadi satu titik ini cukup untuk
   tahu ada pekerjaan yang sedang jalan, termasuk simpan state latar. */
(function wzWatchRequests(){
 const plain=window.fetch;
 if(typeof plain!=='function'||plain.__wzWatched)return;
 const watched=function(input,init){
  wzNetBegin();
  return plain.call(window,input,init).then(function(res){
   wzNetEnd(!(res&&res.ok===false));
   return res;
  },function(err){
   wzNetEnd(false);
   throw err;
  });
 };
 watched.__wzWatched=true;
 window.fetch=watched;
})();

function wzSetBusy(el,on,label){
 if(!el)return;
 if(on){
  if(el.__wzBusy)return;
  el.__wzBusy=true;
  if(label){
   wzNet.label=label;
   wzNetPaint();
  }
  el.setAttribute('aria-busy','true');
  el.classList.add('wz-busy');
  if('disabled' in el)el.disabled=true;
  return;
 }
 if(!el.__wzBusy)return;
 el.__wzBusy=false;
 el.classList.remove('wz-busy');
 el.removeAttribute('aria-busy');
 if('disabled' in el)el.disabled=false;
}
/* Batas menunggu. `hard` adalah pagar pengaman terakhir: kalau ada
   perintah yang promise-nya tidak pernah selesai, tombol tetap dibuka
   supaya aplikasi tidak terkunci selamanya. */
const WZ_BUSY_LIMITS={idle:40,hard:20000};
window.wzBusyLimits=WZ_BUSY_LIMITS;
function wzWithBusy(el,label,task){
 if(!el)return task();
 wzSetBusy(el,true,label);
 let cleared=false;
 let cap=0;
 function clear(){
  if(cleared)return;
  cleared=true;
  clearTimeout(cap);
  wzSetBusy(el,false);
 }
 cap=setTimeout(clear,WZ_BUSY_LIMITS.hard);
 /* Tunggu sampai tidak ada permintaan yang masih menggantung, supaya
   tombol tidak langsung hidup lagi padahal server belum selesai. */
 function clearWhenIdle(attempt){
  if(cleared)return;
  if(wzNet.count===0||attempt>WZ_BUSY_LIMITS.idle){clear();return}
  setTimeout(function(){clearWhenIdle(attempt+1)},80);
 }
 let result;
 try{result=task()}catch(e){clear();throw e}
 if(result&&typeof result.then==='function'){
  return result.then(function(v){clearWhenIdle(0);return v},function(e){clear();throw e});
 }
 // Aksi sinkron (hanya mengubah state di memori lalu mengirim ke server lewat
 // save()) tidak mengembalikan promise, jadi tunggu satu tick supaya
 // permintaan yang baru dikirim sempat terhitung.
 setTimeout(function(){clearWhenIdle(0)},120);
 return result;
}

function wzInstallBusyFeedback(){
 Object.keys(WZ_BUSY_ACTIONS).forEach(function(name){
  const fn=window[name];
  if(typeof fn!=='function'||fn.__wzBusyWrapped)return;
  const wrapped=function(){
   const el=wzTap.el;
   const ctx=this,args=arguments;
   // Sudah berputar atau tidak ada tombol yang ditekan: jalankan apa
   // adanya supaya tidak ada aksi yang hilang.
   if(!el||el.__wzBusy)return fn.apply(ctx,args);
   return wzWithBusy(el,WZ_BUSY_ACTIONS[name],function(){return fn.apply(ctx,args)});
  };
  wrapped.__wzBusyWrapped=true;
  window[name]=wrapped;
 });
}

let wzForumSeenSavedAt=0;
let wzForumReadSentAt=0;

// Penanda "sudah dibaca" disimpan di server per user (wz_owner_forum_reads),
// bukan hanya di app-state. Ini yang membuat badge tetap 0 setelah aplikasi
// ditutup lalu dibuka lagi: sebelumnya satu-satunya penanda tinggal di dalam
// satu blob app-state per bisnis, dan blob itu bisa gagal ditulis.
function markOwnerForumSeen(){
  db.profile=db.profile||{};
  const now=Date.now();
  wzForumSeenAt=Math.max(wzForumSeenAt,now);
  db.profile.ownerForumSeenAt=new Date(wzForumSeenAt).toISOString();
  wzForumUnread=0;
  topbarBadge('wzChatBadge',0);
  // Kirim penanda ke server segera (tanpa debounce) supaya tetap berlaku
  // walau aplikasi ditutup satu detik kemudian. Throttle 15 detik hanya
  // menahan pengulangan dari auto-refresh, bukan menahan entry pertama.
  if(now-wzForumReadSentAt>=15000){
    wzForumReadSentAt=now;
    Promise.resolve()
      .then(()=>window.api('owner-forum/read',{method:'POST',body:JSON.stringify({})}))
      .then(r=>{
        const serverSeen=Date.parse(r?.lastReadAt||'')||0;
        if(serverSeen)wzForumSeenAt=Math.max(wzForumSeenAt,serverSeen);
      })
      .catch(()=>{});
  }
  // app-state tetap ditulis sebagai cadangan, mengikuti throttle yang lama.
  if(wzForumSeenAt-wzForumSeenSavedAt<15000)return;
  wzForumSeenSavedAt=wzForumSeenAt;
  window.WZOnlineStateSave?.queue?.();
}

async function refreshOwnerForumBadge(){
  if(!currentUser||!can('ownerForum')){wzForumUnread=0;topbarBadge('wzChatBadge',0);return}
  if(Date.now()-wzForumCheckedAt<60000)return;
  wzForumCheckedAt=Date.now();
  // Sumber utama: hitungan unread per user dari server. Kalau endpoint ini
  // gagal (mis. DDL belum dijalankan), jatuh ke perhitungan lama berbasis
  // timestamp app-state + 40 pesan terbaru.
  try{
    const s=await window.api('owner-forum/read');
    if(s&&typeof s.unread==='number'){
      const serverSeen=Date.parse(s.lastReadAt||'')||0;
      if(serverSeen)wzForumSeenAt=Math.max(wzForumSeenAt,serverSeen);
      wzForumUnread=Math.max(0,Number(s.unread)||0);
      topbarBadge('wzChatBadge',wzForumUnread);
      return;
    }
  }catch{}
  try{
    const r=await window.api('owner-forum/messages');
    const list=Array.isArray(r.messages)?r.messages:[];
    const profileSeen=Date.parse((db.profile||{}).ownerForumSeenAt||'')||0;
    const seen=Math.max(wzForumSeenAt||0,profileSeen)||(Date.now()-86400000);
    const myId=String(currentUser?.id??'');
    // Unread personal: pesan forum global, tapi dihitung per user. Pesan milik
    // sendiri tidak dihitung sebagai unread.
    wzForumUnread=list.filter(m=>{
      if(Date.parse(m.createdAt||0)<=seen)return false;
      if(m.senderRole!=='owner')return true;
      return !myId||String(m.senderId??'')!==myId;
    }).length;
    topbarBadge('wzChatBadge',wzForumUnread);
  }catch{
    wzForumUnread=0;
    topbarBadge('wzChatBadge',0);
  }
}

  else refreshOwnerForumBadge();

/* TABEL -> KARTU DI LAYAR KECIL
   Tabel di aplikasi ini punya min-width:700px, jadi di HP 360px selalu
   berakhir jadi geser-horizontal -- sumber komplain paling sering. Di bawah
   ambang lebar tertentu tiap baris tabel berubah jadi kartu: nama kolom
   diambil dari <thead> lalu ditempel ke sel sebagai data-wz-th, dan CSS
   menampilkannya lewat content:attr(). Baris yang punya onclick tetap bisa
   diketuk karena yang diubah hanya tampilannya, bukan strukturnya.

   Berjalan otomatis untuk setiap tabel, jadi tabel yang dibuat berikutnya
   ikut rapi tanpa perlu menambah kode lagi. */
function wzApplyCardMode(root){
  const scope=root||document;
  scope.querySelectorAll('table').forEach(table=>{
    const head=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    table.querySelectorAll('tbody tr').forEach(row=>{
      const cells=[...row.children].filter(cell=>cell.tagName==='TD');
      // Baris rekap/total cuma punya satu sel ber-colspan. Itu bukan kartu
      // data, melainkan blok catatan, jadi dibiarkan penuh lebar tanpa label.
      const summary=cells.length===1&&Number(cells[0].getAttribute('colspan')||1)>1;
      row.classList.toggle('wz-card-summary',summary);
      if(summary){cells[0].removeAttribute('data-wz-th');return}
      cells.forEach((cell,i)=>{
        const label=head[i]||'';
        if(label)cell.setAttribute('data-wz-th',label);
        else cell.removeAttribute('data-wz-th');
      });
    });
  });
}
function wzWatchCardMode(node){
  if(!node||typeof MutationObserver==='undefined')return;
  new MutationObserver(()=>wzApplyCardMode(node)).observe(node,{childList:true,subtree:true});
}
window.wzApplyCardMode=wzApplyCardMode;
document.addEventListener('DOMContentLoaded',()=>{
  wzWatchCardMode(document.getElementById('content'));
  wzWatchCardMode(document.getElementById('dialog'));
  wzWatchCardMode(document.getElementById('modalBody'));
  wzApplyCardMode(document);
});

function dashboardDateObj(iso){
 const p=String(iso||'').split('-').map(Number);
 return new Date(Date.UTC(p[0]||1970,(p[1]||1)-1,p[2]||1));
}
function dashboardIso(d){
 return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function dashboardMonthName(m){return ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][m]}
function dashboardGraphBuckets(period,feed){
 const today=dashboardDateObj(dateNow()), out=[];
 let range=window.__dashboardGraphRange||{};
 let start=range.from?dashboardDateObj(range.from):null;
 let end=range.to?dashboardDateObj(range.to):null;
 if(!start||!end){start=new Date(today);start.setUTCDate(today.getUTCDate()-6);end=today}
 if(start>end){const t=start;start=end;end=t}
 const clampStart=dashboardIso(start),clampEnd=dashboardIso(end);

 if(period==='day'){
  for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1)){
   const iso=dashboardIso(d);
   out.push({key:iso,label:`${d.getUTCDate()} ${dashboardMonthName(d.getUTCMonth())}`,start:iso,end:iso,shortLabel:`${d.getUTCDate()} ${dashboardMonthName(d.getUTCMonth())}`});
  }
 }else if(period==='week'){
  const dow=start.getUTCDay()||7;
  const first=new Date(start); first.setUTCDate(first.getUTCDate()-(dow-1));
  for(let s=new Date(first);s<=end;){
   const e=new Date(s);e.setUTCDate(e.getUTCDate()+6);
   const bs=new Date(Math.max(s.getTime(),start.getTime()));
   const be=new Date(Math.min(e.getTime(),end.getTime()));
   if(bs<=be)out.push({key:dashboardIso(bs),label:`${bs.getUTCDate()}–${be.getUTCDate()} ${dashboardMonthName(be.getUTCMonth())}`,start:dashboardIso(bs),end:dashboardIso(be),shortLabel:`${bs.getUTCDate()}–${be.getUTCDate()}`});
   s.setUTCDate(s.getUTCDate()+7);
  }
 }else if(period==='month'){
  let x=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),1));
  const lastMonth=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth(),1));
  for(;x<=lastMonth;x.setUTCMonth(x.getUTCMonth()+1)){
   const mStart=new Date(x), mEnd=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0));
   const bs=new Date(Math.max(mStart.getTime(),start.getTime()));
   const be=new Date(Math.min(mEnd.getTime(),end.getTime()));
   out.push({key:`${x.getUTCFullYear()}-${String(x.getUTCMonth()+1).padStart(2,'0')}`,label:`${dashboardMonthName(x.getUTCMonth())} ${x.getUTCFullYear()}`,start:dashboardIso(bs),end:dashboardIso(be),shortLabel:dashboardMonthName(x.getUTCMonth())});
  }
 }else{
  for(let y=start.getUTCFullYear();y<=end.getUTCFullYear();y++){
   const ys=`${y}-01-01`, ye=`${y}-12-31`;
   const bs=y===start.getUTCFullYear()?clampStart:ys;
   const be=y===end.getUTCFullYear()?clampEnd:ye;
   out.push({key:String(y),label:String(y),start:bs,end:be,shortLabel:String(y)});
  }
 }
 return out;
}

function ownerLineChart(type,items,colorClass,valueLabel){
 const vals=items.map(x=>Number(x.value||0)), max=Math.max(1,...vals), w=600,h=230,pL=48,pR=16,pT=18,pB=34;
 const usableW=w-pL-pR, usableH=h-pT-pB;
 const pts=items.map((x,i)=>({x:items.length===1?pL+usableW/2:pL+i*(usableW/(items.length-1)),y:pT+usableH-(Number(x.value||0)/max)*usableH,...x}));
 const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
 const grid=[0,.25,.5,.75,1].map(q=>{const y=pT+usableH-q*usableH;return `<line class="gridline" x1="${pL}" y1="${y}" x2="${w-pR}" y2="${y}"/><text class="axis-label" x="${pL-7}" y="${y+4}" text-anchor="end">${rupiah(Math.round(max*q))}</text>`}).join('');
 const circles=pts.map(p=>`<g class="click-point" role="button" tabindex="0" onclick="dashboardGraphDetail('${type}','${encodeURIComponent(p.key)}','${encodeURIComponent(p.label)}')"><title>${ownerChartEsc(p.label)} — ${ownerChartEsc(valueLabel)}: ${ownerChartEsc(rupiah(p.value))}</title><circle class="point-${colorClass}" cx="${p.x}" cy="${p.y}" r="5"/></g>`).join('');
 const labels=pts.map(p=>`<text class="axis-label" x="${p.x}" y="${h-10}" text-anchor="middle">${ownerChartEsc(p.shortLabel||p.label)}</text>`).join('');
 return `<div class="owner-chart-line"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="${ownerChartEsc(valueLabel)}">${grid}<path class="line-${colorClass}" d="${path}"/>${circles}${labels}</svg></div><div class="owner-chart-legend"><i class="${colorClass}"></i><span>${ownerChartEsc(valueLabel)} · titik dapat diklik untuk detail</span></div>`;
}
function ownerRankChart(items,colorClass,valueFormatter){
 if(!items.length)return '<div class="owner-ranked-chart"><div class="empty">Belum ada data.</div></div>';
 const max=Math.max(1,...items.map(x=>Number(x.value||0)));
 return `<div class="owner-ranked-chart">${items.map(x=>`<button type="button" class="owner-rank-row" onclick="dashboardGraphDetail('${x.type}','${encodeURIComponent(x.id||x.name)}','${encodeURIComponent(x.periodLabel||'')}')"><span class="owner-rank-name">${ownerChartEsc(x.name)}</span><span class="owner-rank-track"><span class="owner-rank-fill ${colorClass}" style="display:block;width:${Math.max(3,(Number(x.value||0)/max)*100)}%"></span></span><span class="owner-rank-value">${ownerChartEsc(valueFormatter(x.value))}</span></button>`).join('')}</div>`;
}

/* VALIDASI FORM LAPORAN TUTUP SHIFT (role karyawan)
   Satu tempat untuk kedua jalur simpan (lokal dan online), supaya tidak ada
   lagi laporan yang lolos ke server hanya karena salah ketik.

   Aturan-aturunya cermin dari normalizeShiftReport() di lib/helpers.js. Kalau
   di sini ditolak, server juga akan menolak -- bedanya, karyawan langsung
   tahu field mana yang salah, bukan baru melihat "gagal disimpan" dari server.

   Yang paling penting: angka turunan (total pembayaran, kas akhir seharusnya,
   selisih kasir, total layanan/produk, omzet) dihitung di sini dari angka
   mentah form. Sebelumnya omzet hanya penjumlahan berjalan dan angka turunan
   lain dikirim apa adanya, sehingga layar bisa menampilkan angka yang
   berbeda dari isi barisnya. */
const SHIFT_FORM_TYPES=['Full Shift','Pagi','Siang','Sore'];
const SHIFT_FORM_MAX_CUSTOMERS=100000;
const SHIFT_FORM_MAX_NOTE=2000;
const SHIFT_FORM_MAX_ROWS=200;
const SHIFT_FORM_MAX_QTY=10000;

function shiftFormText(value){
  return String(value===null||value===undefined?'':value).trim();
}
function shiftFormNumber(value,label){
  const text=shiftFormText(value);
  if(text==='')return {ok:true,value:0};
  if(!/^-?\d+(\.\d+)?$/.test(text))return {ok:false,error:label+' harus diisi angka saja (tanpa huruf, titik ribuan, atau koma).'};
  const n=Number(text);
  if(!Number.isFinite(n))return {ok:false,error:label+' harus diisi angka saja.'};
  if(n<0)return {ok:false,error:label+' tidak boleh negatif. Hapus tanda minus.'};
  if(!Number.isInteger(n))return {ok:false,error:label+' harus angka bulat, tanpa angka di belakang koma.'};
  if(n>1e12)return {ok:false,error:label+' terlalu besar untuk satu shift.'};
  return {ok:true,value:n};
}
function shiftFormDate(value){
  const text=shiftFormText(value);
  if(!text)return {ok:false,error:'Tanggal laporan shift belum diisi.'};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(text))return {ok:false,error:'Tanggal laporan shift harus format YYYY-MM-DD.'};
  const parts=text.split('-').map(Number);
  const back=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  if(back.getUTCFullYear()!==parts[0]||back.getUTCMonth()!==parts[1]-1||back.getUTCDate()!==parts[2])
    return {ok:false,error:'Tanggal '+text+' tidak ada di kalender.'};
  const now=new Date();
  const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  const day=Date.UTC(parts[0],parts[1]-1,parts[2]);
  if(day>today+86400000)return {ok:false,error:'Tanggal laporan shift tidak boleh di masa depan.'};
  if(day<today-366*86400000)return {ok:false,error:'Tanggal laporan shift terlalu lama. Maksimal 366 hari ke belakang.'};
  return {ok:true,value:text};
}
function shiftFormLabel(text,max){
  const t=shiftFormText(text);
  if(!t)return 'tanpa nama';
  return t.length>max?('"'+t.slice(0,20)+'..."'):('"'+t+'"');
}

// Membaca seluruh form laporan shift sekaligus: memvalidasi setiap field,
// lalu mengembalikan payload yang sudah bersih. Hasil:
// {ok:true, report:{...}} atau {ok:false, error:'pesan untuk karyawan'}.
function readShiftReportForm(){
  const fail=error=>({ok:false,error});
  const get=id=>document.getElementById(id);

  const date=shiftFormDate(get('srDate')?.value);
  if(!date.ok)return fail(date.error);

  const shiftType=shiftFormText(get('srShift')?.value);
  if(!SHIFT_FORM_TYPES.includes(shiftType))return fail('Jenis shift belum dipilih dengan benar.');

  const employees=db.employees||[];
  const emp=employees.find(e=>e.id===currentUser?.employeeId)||employees.find(e=>e.name===currentUser?.name);
  if(!emp)return fail('Akun ini belum terhubung ke data karyawan. Minta Owner/Test Hubungkan dulu di halaman Karyawan.');

  const customers=shiftFormNumber(get('srCustomers')?.value,'Jumlah pelanggan');
  if(!customers.ok)return fail(customers.error);
  if(customers.value>SHIFT_FORM_MAX_CUSTOMERS)return fail('Jumlah pelanggan tidak wajar (maksimal '+SHIFT_FORM_MAX_CUSTOMERS+').');

  // Angka kas dicek lebih dulu, sebelum selisih kasir. Sebelumnya nilai negatif
  // lolos ke perhitungan selisih dan membuat karyawan mendapat pesan "selisih
  // kasir harus Rp0", padahal penyebabnya tanda minus.
  const cashFields=[['srOpening','Kas awal shift'],['srCash','Dibayar tunai'],['srQris','Dibayar QRIS'],['srExpense','Pengeluaran kas shift'],['srPhysical','Uang fisik akhir di kasir']];
  const money={};
  for(const [id,label] of cashFields){
    const n=shiftFormNumber(get(id)?.value,label);
    if(!n.ok)return fail(n.error);
    money[id]=n.value;
  }

  const services=[];
  const seenService=new Set();
  for(const inp of document.querySelectorAll('.sr-service-qty')){
    const serviceId=shiftFormText(inp.dataset.service);
    if(!serviceId)return fail('Ada baris layanan tanpa ID layanan. Muat ulang halaman lalu coba lagi.');
    if(seenService.has(serviceId))return fail('Layanan '+shiftFormLabel(inp.closest('.feature')?.querySelector('b')?.textContent,40)+' tercatat dua kali.');
    seenService.add(serviceId);
    const svc=(db.services||[]).find(s=>s.id===serviceId);
    const name=svc?.name||shiftFormText(inp.closest('.feature')?.querySelector('b')?.textContent)||'Layanan';
    const price=Number(inp.dataset.price||0);
    if(!Number.isFinite(price)||price<0)return fail('Harga layanan '+shiftFormLabel(name,40)+' tidak valid.');
    const qty=shiftFormNumber(inp.value,'Jumlah '+name);
    if(!qty.ok)return fail(qty.error);
    if(qty.value>SHIFT_FORM_MAX_QTY)return fail('Jumlah '+shiftFormLabel(name,40)+' melebihi batas '+SHIFT_FORM_MAX_QTY+' per shift.');
    if(qty.value===0)continue;
    services.push({
      serviceId,
      serviceName:name,
      // Kategori gaji ikut dicatat sebagai snapshot saat pekerjaan itu
      // dicatat, supaya bonus karyawan tidak ikut hilang kalau Owner
      // menghapus layanannya dari master.
      payrollCategory:svc?.payrollCategory||'',
      qty:qty.value,
      price,
      total:Math.round(qty.value*price*100)/100
    });
    if(services.length>SHIFT_FORM_MAX_ROWS)return fail('Terlalu banyak baris layanan (maksimal '+SHIFT_FORM_MAX_ROWS+').');
  }

  const products=[];
  for(const row of document.querySelectorAll('.shift-product')){
    const name=shiftFormText(row.querySelector('.sr-product-name')?.value);
    const qtyRaw=shiftFormText(row.querySelector('.sr-product-qty')?.value);
    const priceRaw=shiftFormText(row.querySelector('.sr-product-price')?.value);
    if(!name&&qtyRaw===''&&priceRaw==='')continue;
    if(!name)return fail('Ada baris produk tanpa nama. Isi namanya, atau hapus baris tersebut.');
    if(name.length>200)return fail('Nama produk '+shiftFormLabel(name,200)+' melebihi 200 karakter.');
    const qty=shiftFormNumber(qtyRaw||'0','Jumlah produk '+shiftFormLabel(name,40));
    if(!qty.ok)return fail(qty.error);
    if(qty.value>SHIFT_FORM_MAX_QTY)return fail('Jumlah produk '+shiftFormLabel(name,40)+' melebihi batas '+SHIFT_FORM_MAX_QTY+' per shift.');
    const price=shiftFormNumber(priceRaw||'0','Harga produk '+shiftFormLabel(name,40));
    if(!price.ok)return fail(price.error);
    products.push({name,qty:qty.value,price:price.value,total:Math.round(qty.value*price.value*100)/100});
    if(products.length>SHIFT_FORM_MAX_ROWS)return fail('Terlalu banyak baris produk (maksimal '+SHIFT_FORM_MAX_ROWS+').');
  }

  const note=shiftFormText(get('srNote')?.value);
  if(note.length>SHIFT_FORM_MAX_NOTE)return fail('Catatan shift terlalu panjang: '+note.length+' karakter, maksimal '+SHIFT_FORM_MAX_NOTE+'.');

  const serviceTotal=Math.round(services.reduce((a,x)=>a+x.total,0)*100)/100;
  const productTotal=Math.round(products.reduce((a,x)=>a+x.total,0)*100)/100;
  const totalOmzet=Math.round((serviceTotal+productTotal)*100)/100;
  const totalPayment=Math.round((money.srCash+money.srQris)*100)/100;
  const expectedCash=Math.round((money.srOpening+money.srCash-money.srExpense)*100)/100;
  const cashDifference=Math.round((money.srPhysical-expectedCash)*100)/100;

  if(services.length===0||serviceTotal<=0)return fail('Isi minimal 1 layanan terlebih dahulu.');
  if(totalPayment<=0)return fail('Total pembayaran harus lebih dari Rp0.');
  if(Math.abs(cashDifference)>0.01)
    return fail('Selisih kasir harus Rp0. Uang fisik akhir di kasir '+rupiah(money.srPhysical)+' belum sama dengan kas akhir seharusnya '+rupiah(expectedCash)+' (selisih '+rupiah(cashDifference)+').');

  return {
    ok:true,
    report:{
      id:window.__wzShiftStableId||('SHIFT'+Date.now()),
      date:date.value,
      employeeId:emp.id,
      employeeName:emp.name,
      shiftType,
      customers:customers.value,
      openingCash:money.srOpening,
      cash:money.srCash,
      qris:money.srQris,
      cashExpense:money.srExpense,
      physicalCash:money.srPhysical,
      totalPayment,
      expectedCash,
      cashDifference,
      serviceTotal,
      productTotal,
      totalOmzet,
      services,
      products,
      note,
      savedAt:new Date().toISOString()
    }
  };
}

/* PAYROLL ENGINE
   Aturan default (bisa diganti per bisnis, dan per karyawan):
   - Gaji pokok Rp2.000.000
   - Haircut: bonus mulai dari Haircut ke-157, tiap potong Rp10.000
   - Hairwash / Hairstyling / Shaving: Rp2.000 per transaksi
   - Haircoloring: Rp20.000 per transaksi

   Tiga lapis, dari yang paling umum ke yang paling khusus:
   1. bawaan di bawah ini
   2. pengaturan umum bisnis (wz_payroll_settings)
   3. pengaturan khusus karyawan (wz_employee_payroll)

   Yang tidak diisi di lapis 2/3 otomatis memakai lapis di atasnya. Semua
   angka dibaca apa adanya, jadi 0 berarti "benar-benar 0" (bonus dimatikan
   atau tanpa ambang), bukan "tidak diisi". */
const PAYROLL_DEFAULT_BASE_SALARY=2000000;
const PAYROLL_DEFAULT_PERIOD_DAY=24;
const PAYROLL_CATEGORIES=[
  {key:'haircut',label:'Haircut',threshold:157,bonus:10000},
  {key:'hairwash',label:'Hairwash',threshold:1,bonus:2000},
  {key:'hairstyling',label:'Hairstyling',threshold:1,bonus:2000},
  {key:'shaving',label:'Shaving',threshold:1,bonus:2000},
  {key:'haircoloring',label:'Haircoloring',threshold:1,bonus:20000}
];
const PAYROLL_CATEGORY_KEYS=PAYROLL_CATEGORIES.map(c=>c.key);
const PAYROLL_CATEGORY_LABEL=Object.fromEntries(PAYROLL_CATEGORIES.map(c=>[c.key,c.label]));
const PAYROLL_CATEGORY_DEFAULT=Object.fromEntries(PAYROLL_CATEGORIES.map(c=>[c.key,{threshold:c.threshold,bonus:c.bonus}]));
const PAYROLL_SERVER_KEY={haircut:'Haircut',hairwash:'Hairwash',hairstyling:'Hairstyling',shaving:'Shaving',haircoloring:'Haircoloring'};

// Angka finite dipakai apa adanya; 0 sah. Hanya yang bukan angka (undefined,
// '', null, NaN) yang jatuh ke bawaan.
function payrollNum(value,fallback){
  if(value===''||value===null||value===undefined)return fallback;
  const n=Number(value);
  return Number.isFinite(n)?n:fallback;
}
function payrollDay(value,fallback){
  const n=Math.trunc(payrollNum(value,fallback));
  return Math.min(31,Math.max(1,n||PAYROLL_DEFAULT_PERIOD_DAY));
}
function payrollRuleFrom(raw,fallback){
  const base=fallback||{threshold:1,bonus:0};
  if(!raw||typeof raw!=='object')return {...base};
  return {
    threshold:Math.max(0,Math.trunc(payrollNum(raw.threshold,base.threshold))),
    bonus:Math.max(0,payrollNum(raw.bonus,base.bonus))
  };
}
function payrollRuleBucket(source){
  // `typeof null` adalah 'object', jadi serviceRules:null lolos dari
  // pemeriksaan biasa dan keluar dari fungsi ini sebagai null. Pemanggilnya
  // lalu melakukan `bucket[key]` pada null, dan error itu tidak tertangkap:
  // seluruh halaman berhenti (blank), bukan cuma satu baris.
  const rules=source&&typeof source==='object'?source.serviceRules:null;
  return rules&&typeof rules==='object'&&!Array.isArray(rules)?rules:{};
}
function payrollPickRule(raw,key){
  const bucket=payrollRuleBucket(raw);
  return bucket[PAYROLL_SERVER_KEY[key]]||bucket[key]||null;
}

// Pengaturan khusus karyawan (bisa null = tidak ada, ikut pengaturan umum).
function payrollSettingsForEmployee(employeeId){
  const map=db.payrollSettings?.employees;
  if(!map||typeof map!=='object'||Array.isArray(map))return null;
  const row=map[String(employeeId??'')];
  return row&&typeof row==='object'&&!Array.isArray(row)?row:null;
}
function employeeHasCustomPayroll(employeeId){
  return Boolean(payrollSettingsForEmployee(employeeId));
}

// Aturan yang benar-benar dipakai untuk satu karyawan (umum + khusus).
function getPayrollRules(employeeId){
  const business=db.payrollSettings&&typeof db.payrollSettings==='object'?db.payrollSettings:{};
  const own=payrollSettingsForEmployee(employeeId);
  const merged={};
  PAYROLL_CATEGORIES.forEach(c=>{
    const fromBusiness=payrollRuleFrom(payrollPickRule(business,c.key),PAYROLL_CATEGORY_DEFAULT[c.key]);
    merged[c.key]=own?payrollRuleFrom(payrollPickRule(own,c.key),fromBusiness):fromBusiness;
  });
  const businessSalary=payrollNum(business.baseSalary,PAYROLL_DEFAULT_BASE_SALARY);
  const ownSalary=own?payrollNum(own.baseSalary,0):0;
  return {
    rules:merged,
    baseSalary:ownSalary>0?ownSalary:businessSalary,
    periodStartDay:own&&own.periodStartDay?payrollDay(own.periodStartDay,payrollDay(business.periodStartDay,PAYROLL_DEFAULT_PERIOD_DAY))
      :payrollDay(business.periodStartDay,PAYROLL_DEFAULT_PERIOD_DAY),
    customized:Boolean(own)
  };
}

// Kategori gaji sebuah layanan. Kategori eksplisit di master layanan selalu
// menang; pencocokan nama hanya cadangan untuk data lama yang belum diisi.
function payrollServiceKey(service){
  const explicit=String(service?.payrollCategory||'').trim().toLowerCase();
  if(PAYROLL_CATEGORY_KEYS.includes(explicit))return explicit;
  const n=String(service?.name||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!n)return null;
  if(n.includes('haircolor'))return 'haircoloring';
  if(n.includes('hairwash')||n.includes('creambath')||n.includes('shampoo'))return 'hairwash';
  if(n.includes('hairstyl'))return 'hairstyling';
  if(n.includes('shav'))return 'shaving';
  if(n.includes('haircut')||n.includes('gundul')||n.includes('potongrambut')||n.includes('potong'))return 'haircut';
  return null;
}

// Periode [start, endExclusive): tanggal mulai periode sudah milik periode
// berikutnya, jadi tidak ada yang terhitung di dua periode sekaligus.
function payrollPeriodFor(dateStr,startDayOverride){
  const startDay=payrollDay(startDayOverride,getPayrollRules().periodStartDay);
  const d=dashboardDateObj(dateStr||dateNow()),y=d.getUTCFullYear(),m=d.getUTCMonth(),day=d.getUTCDate();
  const lastDay=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const eff=Math.min(startDay,lastDay);
  const base=day>=eff?new Date(Date.UTC(y,m,eff)):new Date(Date.UTC(y,m-1,eff));
  const next=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+1,Math.min(startDay,new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+2,0)).getUTCDate())));
  return {
    start:dashboardIso(base),
    endExclusive:dashboardIso(next),
    // Hari terakhir yang sudah termasuk, untuk ditampilkan ke user.
    end:dashboardIso(new Date(next.getTime()-86400000))
  };
}
function payrollInRange(date,start,endExclusive){
  const d=String(date||'').slice(0,10);
  return d>=start&&d<endExclusive;
}

function payrollCounts(employeeId,start,endExclusive){
  const counts={haircut:0,hairwash:0,hairstyling:0,shaving:0,haircoloring:0};
  const reports=(db.shiftReports||[]).filter(r=>r.employeeId===employeeId&&payrollInRange(r.date,start,endExclusive));
  // Laporan tutup shift adalah catatan karyawan sendiri, jadi itu yang dipakai.
  // Transaksi POS pada tanggal yang sama untuk karyawan yang sama diabaikan;
  // kalau tidak, satu pekerjaan yang dicatat dua kali akan dibayar komisi
  // dua kali.
  const reportedDates=new Set(reports.map(r=>String(r.date||'').slice(0,10)));
  (db.transactions||[]).filter(t=>t.employeeId===employeeId&&t.status==='SELESAI'&&payrollInRange(t.date,start,endExclusive)&&!reportedDates.has(String(t.date||'').slice(0,10))).forEach(t=>{
    const key=payrollServiceKey(getService(t.serviceId));
    if(key)counts[key]+=1;
  });
  reports.forEach(r=>{
    (r.services||[]).forEach(x=>{
      // Urutan penting: master yang dipakai lebih dulu, supaya kalau Owner
      // memperbaiki kategori suatu layanan, semua laporannya ikut benar.
      // Snapshot dipakai hanya kalau layanannya sudah tidak ada di master.
      // Terakhir baru pencocokan nama, untuk laporan lama yang belum punya
      // snapshot sama sekali.
      const live=getService(x.serviceId);
      const key=(live&&payrollServiceKey(live))
        ||payrollServiceKey({name:x.serviceName,payrollCategory:x.payrollCategory})
        ||null;
      if(key)counts[key]+=Number(x.qty||0);
    });
  });
  return counts;
}

// Satu harga minced: N pelanggan menghasilkan bonus mulai pelanggan ke-`threshold`.
function payrollBonusCustomers(count,threshold){
  const start=Math.max(1,Math.trunc(Number(threshold)||1));
  return Math.max(0,count-(start-1));
}
function payrollBaseSalaryFor(employeeId,employee,rules){
  const own=payrollSettingsForEmployee(employeeId);
  const ownSalary=own?Number(own.baseSalary)||0:0;
  if(ownSalary>0)return {baseSalary:ownSalary,source:'Pengaturan khusus karyawan'};
  const employeeSalary=Number(employee?.salary)||0;
  if(employeeSalary>0)return {baseSalary:employeeSalary,source:'Gaji pada data karyawan'};
  const businessSalary=Number(rules.baseSalary)||PAYROLL_DEFAULT_BASE_SALARY;
  return {baseSalary:businessSalary,source:'Pengaturan umum bisnis'};
}
function calculatePayroll(employeeId,periodDate){
  const e=getEmployee(employeeId);
  if(!e)return null;
  const rules=getPayrollRules(employeeId);
  const period=payrollPeriodFor(periodDate||dateNow(),rules.periodStartDay);
  const counts=payrollCounts(employeeId,period.start,period.endExclusive);
  const detail={};
  PAYROLL_CATEGORIES.forEach(c=>{
    const rule=rules.rules[c.key];
    const bonusCustomers=payrollBonusCustomers(counts[c.key],rule.threshold);
    detail[c.key]={label:c.label,customers:counts[c.key],threshold:rule.threshold,bonusCustomers,rate:rule.bonus,bonus:bonusCustomers*rule.bonus};
  });
  const totalBonus=Object.values(detail).reduce((s,x)=>s+x.bonus,0);
  const base=payrollBaseSalaryFor(employeeId,e,rules);
  return {
    employeeId,employeeName:e.name,
    periodStart:period.start,periodEnd:period.end,periodEndExclusive:period.endExclusive,
    periodStartDay:rules.periodStartDay,
    baseSalary:base.baseSalary,baseSalarySource:base.source,
    customized:rules.customized,
    counts:detail,totalBonus,totalPay:base.baseSalary+totalBonus
  };
}

 <p class="muted" style="margin-top:10px">Gaji pokok mengikuti: ${escapeHtml(String(pay.baseSalarySource||'-'))}${pay.customized?' · memakai pengaturan khusus karyawan ini.':''}</p>

}

/* ---- Pengaturan gaji per karyawan --------------------------------------

 <label>Gaji Pokok (kosong = pakai data karyawan)<input id="epBaseSalary" type="number" min="0" value="${ownSalary}"></label>
 <label>Tanggal Mulai Periode (kosong = ikut bisnis)<input id="epPeriodDay" type="number" min="1" max="31" value="${ownDay}"></label>

</div>
${(()=>{

<div class="dialog-actions">

// Apakah Owner sudah mengetik apa pun di dialog Atur Gaji.
function payrollEmployeeFormHasValue(){

}
// Kotak centang otomatis tercentang begitu ada angka yang diketik, supaya
// tampilan selalu jujur soal apa yang akan disimpan.
function syncPayrollEnabledBox(){
  const box=document.getElementById('epEnabled');
  if(box&&!box.checked&&payrollEmployeeFormHasValue())box.checked=true;
}
function readPayrollEmployeeForm(){
  // Kotak centang menentukan aktif atau tidak -- TAPI isian yang sudah
  // diketik selalu menang. Sebelumnya `enabled` hanya membaca kotak centang,
  // dan kotak itu tidak tercentang untuk karyawan yang belum punya
  // pengaturan khusus. Akibatnya saveEmployeePayroll selalu melihat
  // "tidak aktif" dan memanggil resetEmployeePayroll: semua angka yang
  // diketik Owner dibuang, dan toast malah berbunyi "Pengaturan khusus
  // karyawan dihapus". Fitur Atur Gaji praktis tidak bisa dipakai sama sekali.
  const enabled=document.getElementById('epEnabled')?.checked!==false||payrollEmployeeFormHasValue();
  const baseSalaryRaw=document.getElementById('epBaseSalary')?.value??'';
  const periodDayRaw=document.getElementById('epPeriodDay')?.value??'';
  const serviceRules={};
  document.querySelectorAll('#dialog [data-k]').forEach(input=>{
    const key=input.dataset.k,field=input.dataset.f,raw=String(input.value??'').trim();
    if(raw==='')return;
    const n=Number(raw);
    if(!Number.isFinite(n)||n<0)return;
    if(!serviceRules[PAYROLL_SERVER_KEY[key]])serviceRules[PAYROLL_SERVER_KEY[key]]={};
    serviceRules[PAYROLL_SERVER_KEY[key]][field]=field==='threshold'?Math.trunc(n):n;
  });
  return {
    enabled,
    baseSalary:baseSalaryRaw===''?0:Number(baseSalaryRaw),
    periodStartDay:periodDayRaw===''?null:Number(periodDayRaw),
    serviceRules
  };
}
async function saveEmployeePayroll(employeeId){
  if(!guard('payrollSettings'))return;
  if(!['owner','manager'].includes(currentUser?.role))return toast('Hanya Owner/Manager yang dapat mengubah pengaturan gaji.',true);

  if(form.periodStartDay!==null&&(!Number.isInteger(form.periodStartDay)||form.periodStartDay<1||form.periodStartDay>31))

// Layanan milik tenant ini, dikelompokkan per kategori gaji. Halaman
// Pengaturan Gaji harus menampilkan data layanan yang benar-benar dimiliki
// Owner, bukan daftar kategori tetap yang tidak ada hubungannya dengan tokony.
// Layanan yang belum diberi kategori dikembalikan sebagai "unassigned" supaya
// Owner bisa mengaturnya langsung dari halaman ini.
function payrollServiceGroups(){
  const list=Array.isArray(db.services)?db.services:[];
  const groups={};
  PAYROLL_CATEGORY_KEYS.forEach(k=>{groups[k]=[]});
  const unassigned=[];
  list.forEach(svc=>{
    const key=payrollServiceKey(svc);
    if(key&&groups[key])groups[key].push(svc);
    else unassigned.push(svc);
  });
  return {groups,unassigned,total:list.length};
}
// Opsi kategori untuk sebuah layanan. `current` adalah payrollCategory yang
// benar-benar tersimpan, jadi kalau kosong Select akan menampilkan "Belum
// diatur" sebagai pilihan aktif. Sebelumnya tidak ada opsi kosong sama sekali,
// sehingga browser otomatis menyorot opsi pertama (Haircut) untuk layanan yang
// belum berkategori: layar berbohong, dan memilih ulang Haircut tidak memicu
// event `change` sehingga kategori tidak pernah tersimpan.
function payrollServiceOptions(current){
  const value=String(current||'').trim();
  return `<option value=""${PAYROLL_CATEGORY_KEYS.includes(value)?'':' selected'}>Belum diatur</option>`
    +PAYROLL_CATEGORIES.map(c=>`<option value="${c.key}"${value===c.key?' selected':''}>${c.label}</option>`).join('');
}
function payrollServiceNames(key){
  const {groups}=payrollServiceGroups();
  const names=(groups[key]||[]).map(svc=>String(svc.name||'').trim()).filter(Boolean);
  if(!names.length)return '<span class="muted">Belum ada layanan Owner yang memakai kategori ini.</span>';
  return names.map(n=>escapeHtml(n)).join(' · ');
}
async function setServicePayrollCategory(serviceId,category){
  if(!['owner','manager'].includes(currentUser?.role))
    return toast('Hanya Owner/Manager yang dapat mengubah kategori gaji layanan.',true);
  const svc=(db.services||[]).find(x=>String(x.id)===String(serviceId));
  if(!svc)return toast('Layanan tidak ditemukan.',true);
  const next=String(category||'');
  if(!next&&payrollServiceKey(svc))next=svc.payrollCategory||'';
  svc.payrollCategory=PAYROLL_CATEGORY_KEYS.includes(next)?next:'';
  render();
  // Tunggu jawaban server sebelum menyatakan berhasil. Sebelumnya toast
  // "disimpan" muncul apa yang terjadi padahal, sehingga Owner mengira
  // kategorinya sudah aman padahal tidak pernah sampai ke server.
  lastSaveError=null;
  const ok=await save();
  if(ok){toast('Kategori gaji "'+svc.name+'" disimpan.');return}
  // Tampilkan ALASAN sebenarnya. Pesan "periksa koneksi" dulu hanya tebakan,
  // dan terbukti menyesatkan: penyebab sebenarnya bisa konflik versi,
  // langganan tidak aktif, atau state yang kebesaran.
  toast('Kategori "'+svc.name+'" belum tersimpan. '+(lastSaveError?.message||'Coba lagi sebentar.'),true);
}

const analyticsHistory={level:'years',year:null,month:null,day:null};
function analyticsMetric(from,to){

 const omzet=rows.reduce((sum,row)=>sum+Number(row.amount||0),0),pengeluaran=rows.reduce((sum,row)=>sum+Number(row.expense||0),0)+general.reduce((sum,row)=>sum+Number(row.amount||0),0);

function analyticsRangeKeys(){

function analyticsDonut(metric){

}

function analyticsDetail(day){

async function saveMyProfile(){

 const finish=async(avatar)=>{
  const name=currentUser.role==='employee'?currentUser.name:(document.getElementById('pName')?.value.trim()||currentUser.name);
  const phone=document.getElementById('pContact')?.value.trim()||'';

   const r=await window.WZOnlineEmployee.api('profile',{method:'PUT',body:JSON.stringify({name,phone,avatar})});
   currentUser={...currentUser,...(r?.user||{}),phone:r?.profile?.phone??phone,avatar:r?.profile?.avatar??avatar};
   db.profile=db.profile||{};db.profile.name=currentUser.name||db.profile.name;window.WZOnlineStateSave?.queue?.();
   closeModal();render();toast('Profil berhasil diperbarui online.');
  }catch(e){peringatan('Profil gagal disimpan online: '+(e.message||e));}
 };
 if(!f?.files?.[0]){await finish(undefined);return}
 const file=f.files[0];
 if(!file.type.startsWith('image/')){peringatan('File foto harus berupa gambar.');return}
 if(file.size>2*1024*1024){peringatan('Ukuran foto maksimal 2 MB.');return}
 const reader=new FileReader();
 reader.onerror=()=>peringatan('Foto gagal dibaca. Coba pilih foto lain.');
 reader.onload=()=>{
  const img=new Image();img.onerror=()=>peringatan('Foto tidak dapat diproses.');
  img.onload=()=>{const max=800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);finish(c.toDataURL('image/jpeg',0.82));};
  img.src=reader.result;
 };

}

async function importBackup(event){

 try{
  if(!currentUser||!['owner','manager'].includes(currentUser.role))throw new Error('Restore hanya tersedia untuk Owner/Manager.');
  const payload=JSON.parse(await file.text());
  if(!payload||payload.version!==2||!payload.appState||!payload.business)throw new Error('File backup WZ tidak valid.');
  if(!await konfirmasi('Restore backup online? Data pengaturan/master akan diganti, sedangkan transaksi dan laporan shift akan ditambahkan/diperbarui dari backup.',{judul:'Restore Backup',okLabel:'RESTORE',danger:true}))return;
  const currentState=await window.WZOnlineEmployee.api('app-state');
  await window.WZOnlineEmployee.api('app-state',{method:'PUT',body:JSON.stringify({data:payload.appState,expectedUpdatedAt:currentState?.updatedAt||null})});
  const tx=Array.isArray(payload.business.transactions)?payload.business.transactions:[],sh=Array.isArray(payload.business.shiftReports)?payload.business.shiftReports:[];
  if(tx.length||sh.length)await window.WZOnlineEmployee.api('sync-business',{method:'POST',body:JSON.stringify({transactions:tx,shiftReports:sh})});
  if(Array.isArray(payload.employees)){
   for(const e of payload.employees){
    const password=defaultEmployeePassword(e.name||'employee');
    await window.WZOnlineEmployee.api('employees',{method:'PUT',body:JSON.stringify({id:e.id,name:e.name,role:e.role,password,username:defaultEmployeeUsername(e.name),branchId:e.branchId,salary:e.salary,target:e.target})});
   }
  }
  await (window.WZOnlineBusiness?.sync?.()||Promise.resolve());
  await (window.WZOnlineEmployee?.syncEmployeesFromServer?.()||Promise.resolve());
  render();toast('Restore online selesai. Password akun karyawan dipulihkan ke pola default nama+123.');
 }catch(e){peringatan('Restore online gagal: '+(e.message||e));}
 finally{if(event?.target)event.target.value='';}
}

// Form reset hanya boleh mengirim periode kalau dua tanggalnya benar-benar
// terisi dan urutannya masuk akal, supaya tidak ada keadaan setengah di server.
function shiftResetPeriod(){
 if(!guard('system'))return null;
 const mode=document.getElementById('resetPeriodMode')?.value||'all';
 if(mode!=='custom')return{all:true,from:'',to:''};
 const from=String(document.getElementById('resetPeriodFrom')?.value||'');
 const to=String(document.getElementById('resetPeriodTo')?.value||'');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to))return{error:'Isi tanggal awal dan tanggal akhir periode.'};
 if(from>to)return{error:'Tanggal awal tidak boleh melewati tanggal akhir.'};
 return{all:false,from,to};
}
function shiftTestResetScope(){
 const period=shiftResetPeriod();
 if(!period||period.error)return null;
 const inRange=d=>{const s=String(d||'');return period.all||(s>=period.from&&s<=period.to)};
 return{
  period,
  transactions:(db.transactions||[]).filter(x=>inRange(x?.date)).length,
  shiftReports:(db.shiftReports||[]).filter(x=>inRange(x?.date)).length
 };
}
function shiftTestResetPeriodLabel(period){
 return period.all?'seluruh periode':`periode ${period.from} sampai ${period.to}`;
}
function shiftTestResetPeriodChange(){
 const mode=document.getElementById('resetPeriodMode')?.value||'all';
 const fromInput=document.getElementById('resetPeriodFrom');
 const toInput=document.getElementById('resetPeriodTo');
 const info=document.getElementById('resetPeriodInfo');
 if(!fromInput||!toInput)return;
 const custom=mode==='custom';
 fromInput.disabled=!custom;
 toInput.disabled=!custom;
 if(custom){
  // Default sederhana: mulai dari data paling lama yang ada dan selesai hari
  // ini, jadi layar langsung menampilkan angka yang akan dihapus.
  if(!fromInput.value){
   const dates=[...(db.transactions||[]),...(db.shiftReports||[])].map(x=>String(x?.date||'')).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
   fromInput.value=dates[0]||'';
  }
  if(!toInput.value)toInput.value=dateNow();
 }
 if(!info)return;
 const scope=shiftTestResetScope();
 if(!scope){info.textContent='Isi tanggal awal dan tanggal akhir periode untuk melihat jumlah data yang akan dihapus.';return}
 info.textContent=`${custom?'Akan dihapus pada periode':'Akan dihapus untuk'} ${shiftTestResetPeriodLabel(scope.period)}: ${scope.transactions} transaksi dan ${scope.shiftReports} laporan tutup shift.`;
}
async function shiftTestReset(){
 if(!guard('system'))return;
 const scope=shiftTestResetScope();
 if(!scope){peringatan('Pilih tanggal awal dan tanggal akhir periode dengan benar.');shiftTestResetPeriodChange();return}
 if(!await konfirmasi(`Hapus data transaksi (${scope.transactions}) dan laporan tutup shift (${scope.shiftReports}) pada ${shiftTestResetPeriodLabel(scope.period)}? Data karyawan, cabang, pelanggan, layanan, pengeluaran, dan pengaturan lain TIDAK akan dihapus.`,{judul:scope.period.all?'Hapus Semua Data':'Hapus Periode',okLabel:scope.period.all?'HAPUS SEMUA':'HAPUS PERIODE',danger:true}))return;
 if(typeof window.WZOnlineBusiness?.reset!=='function'){peringatan('Reset online belum siap. Pastikan koneksi ke server tersedia.');return;}
 const payload=scope.period.all?{}:{from:scope.period.from,to:scope.period.to};
 let result;
 try{result=await window.WZOnlineBusiness.reset(payload)}catch(e){peringatan('Reset online gagal: '+(e.message||e));return}
 if(!result)return;
 closeModal();
 toast(`Berhasil menghapus ${result.transactions} transaksi dan ${result.shiftReports} laporan tutup shift${result.period?' ('+result.period.from+' sampai '+result.period.to+')':''}.`);
 render();
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

/* ---- Modal WZ MANAGE PRO ------------------------------------------------
   Menggantikan alert/confirm/prompt bawaan browser, yang menampilkan dialog
   berformat "Halaman pada <url> menyatakan:". Semua dialog Obrolan Owner dan
   navigasi pesan memakai modal dark/gold milik aplikasi. */
let wzModalSettle=null;
function wzModalHost(){
  let root=document.getElementById('wzModalRoot');
  if(!root){
    root=document.createElement('div');
    root.id='wzModalRoot';
    (document.body||document.documentElement).appendChild(root);
  }
  return root;
}
function wzModalDismiss(value){
  const root=document.getElementById('wzModalRoot');
  if(root)root.innerHTML='';
  document.removeEventListener('keydown',wzModalOnKey,true);
  if(wzModalSettle){const done=wzModalSettle;wzModalSettle=null;done(value);}
}
function wzModalOnKey(e){if(e.key==='Escape'){e.stopPropagation();wzModalDismiss(null);}}

function wzModal(options={}){
  const {title='',body='',actions=[],onReady=null}=options;
  wzModalDismiss(null);
  const root=wzModalHost();
  const buttons=(actions||[]).map((a,i)=>
    `<button type="button" class="btn${a.primary?' primary':''}${a.danger?' danger':''}" data-wz-action="${i}">${escapeHtml(a.label)}</button>`).join('');
  root.innerHTML=`
    <div class="wz-modal-backdrop" data-wz-backdrop="1">
      <div class="wz-modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title||'WZ MANAGE PRO')}">
        <div class="wz-modal-head">
          <img src="${WZ_APP_LOGO}" alt="" width="26" height="26" style="border-radius:50%;flex:0 0 auto">
          <div class="wz-modal-brand">
            <div class="wz-modal-brand-name">WZ MANAGE PRO</div>
            <h3>${escapeHtml(title||'WZ MANAGE PRO')}</h3>
          </div>
          <button type="button" class="btn small" data-wz-cancel="1" aria-label="Tutup">✕</button>
        </div>
        <div class="wz-modal-body">${body}</div>
        ${buttons?`<div class="wz-modal-actions">${buttons}</div>`:''}
      </div>
    </div>`;
  document.addEventListener('keydown',wzModalOnKey,true);
  root.addEventListener('click',e=>{
    // Hanya klik langsung pada backdrop yang menutup. `closest()` akan cocok
    // juga untuk semua elemen di dalam modal dan menutupnya terlalu cepat.
    if(e.target.dataset&&e.target.dataset.wzBackdrop){wzModalDismiss(null);return;}
    if(e.target.closest('[data-wz-cancel]')){wzModalDismiss(null);return;}
    const btn=e.target.closest('[data-wz-action]');
    if(!btn)return;
    const action=(actions||[])[Number(btn.dataset.wzAction)];
    if(!action)return;
    // Nilai boleh fungsi supaya isian (mis. textarea edit) dibaca selagi
    // masih ada di DOM.
    const value=typeof action.value==='function'?action.value(root):action.value;
    wzModalDismiss(value===undefined?action.label:value);
  });
  if(onReady)onReady(root);
  return new Promise(resolve=>{wzModalSettle=resolve;});
}

function wzConfirm(options={}){
  const {title='Konfirmasi',message='',confirmLabel='OK',cancelLabel='Batal',danger=false}=options;
  return wzModal({
    title,
    body:`<p style="margin:0">${escapeHtml(message)}</p>`,
    actions:[
      {label:cancelLabel,value:false},
      {label:confirmLabel,value:true,primary:!danger,danger}
    ]
  }).then(v=>v===true);
}

function wzPrompt(options={}){
  const {title='Input',label='',value='',maxLength=2000,confirmLabel='Simpan',multiline=true}=options;
  const field=multiline
    ? `<textarea id="wzPromptInput" class="input" rows="4" maxlength="${maxLength}" style="width:100%;resize:vertical">${escapeHtml(value)}</textarea>`
    : `<input id="wzPromptInput" class="input" maxlength="${maxLength}" value="${escapeHtml(value)}" style="width:100%">`;
  return wzModal({
    title,
    body:`<label style="display:block">${label?`<span class="muted" style="display:block;margin-bottom:6px">${escapeHtml(label)}</span>`:''}${field}</label>`,
    actions:[
      {label:'Batal',value:null},
      {label:confirmLabel,value:root=>{const el=root.querySelector('#wzPromptInput');return el?el.value.trim():null;},primary:true}
    ],
    onReady(root){
      const el=root.querySelector('#wzPromptInput');
      if(!el)return;
      el.focus();
      if(el.setSelectionRange){const n=el.value.length;el.setSelectionRange(n,n);}
    }
  }).then(v=>typeof v==='string'&&v?v:null);
}

function wzPicker(title,items,emptyLabel='Tidak ada pilihan.'){
  const list=Array.isArray(items)?items.filter(Boolean):[];
  const body=list.length
    ? `<div class="wz-picker-grid">${list.map(x=>`<button type="button" class="wz-picker-item" data-wz-item="${escapeHtml(x)}" aria-label="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')}</div>`
    : `<p class="muted" style="margin:0">${escapeHtml(emptyLabel)}</p>`;
  return wzModal({
    title,
    body,
    actions:[{label:'Batal',value:null}],
    onReady(root){
      root.addEventListener('click',e=>{
        const b=e.target.closest('[data-wz-item]');
        if(b)wzModalDismiss(b.dataset.wzItem);
      });
    }
  });
}

function wzSheet(options={}){
  const {title='',subtitle='',actions=[]}=options;
  const list=(actions||[]).map((a,i)=>
    `<button type="button" class="wz-sheet-item${a.danger?' danger':''}" data-wz-act="${i}"><span class="wz-sheet-icon">${escapeHtml(a.icon||'')}</span><span>${escapeHtml(a.label)}</span></button>`).join('');
  return wzModal({
    title,
    body:`${subtitle?`<p class="muted" style="margin:0 0 12px">${escapeHtml(subtitle)}</p>`:''}<div class="wz-sheet-list">${list}</div>`,
    actions:[{label:'Tutup',value:null}],
    onReady(root){
      root.addEventListener('click',e=>{
        const b=e.target.closest('[data-wz-act]');
        if(!b)return;
        const action=(actions||[])[Number(b.dataset.wzAct)];
        if(action)wzModalDismiss(action.value);
      });
    }
  });
}

// Reaksi dibatasi ke daftar yang sama dengan validasi server.

const WZ_FORUM_EMOJIS=['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😋','😜','🤪','🤗','🤔','🤨','😐','😑','🙄','😏','😴','😪','😷','🤒','🤕','🥳','😎','🤓','🧐','😕','😟','🙁','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','😤','😡','👍','👎','👏','🙌','🙏','💪','🔥','✨','🎉','❤️','💔','✅','❌','⚡','💯','1️⃣','2️⃣','3️⃣'];
let wzForumMessages=[];
