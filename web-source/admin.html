<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>WZ MANAGE PRO — Admin Platform</title>
<style>
:root{--bg:#060709;--panel:#0e1217;--panel2:#151a21;--line:#2b323b;--gold:#c99932;--gold2:#efd078;--text:#f4f2ec;--muted:#8e98a5;--green:#45c98a;--red:#ef6a6a;--blue:#63aaff;--shadow:0 18px 50px #0008}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 70% -10%,#2b210e 0,#0d1116 35%,#060709 75%);color:var(--text);font:14px Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);padding:34px;border:1px solid #6e551e;border-radius:18px;background:linear-gradient(180deg,#11151a,#0a0d11);box-shadow:var(--shadow)}.brand{font-weight:800;letter-spacing:.2em;color:var(--gold2);font-size:12px}.login h1{font:700 32px Georgia,serif;margin:14px 0 8px}.login p{color:var(--muted);line-height:1.6}.form{display:grid;gap:12px}.field{display:grid;gap:6px;color:#bac1ca;font-size:12px}.field input,.field select,.search{width:100%;border:1px solid #343c46;background:#090c10;color:#fff;border-radius:9px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c9993220}.btn{border:1px solid #414852;background:#151a20;color:#edf0f3;border-radius:9px;padding:10px 13px}.btn:hover{border-color:var(--gold)}.btn.primary{border:0;background:linear-gradient(90deg,#8b681b,#d1a43f);color:#111;font-weight:800}.btn.danger{border-color:#773a3a;color:#ffb0b0}.btn.small{padding:7px 9px;font-size:11px}.error{display:none;color:#ffb1b1;background:#2a1111;border:1px solid #713434;border-radius:8px;padding:10px;font-size:12px}.error.show{display:block}
.shell{min-height:100vh;display:flex}.sidebar{width:250px;flex:0 0 250px;background:#090c10;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}.sidebar .brand{padding:8px 12px 22px}.nav{display:grid;gap:4px}.nav button{width:100%;text-align:left;border:0;border-radius:9px;background:transparent;color:#c5cad1;padding:11px 12px}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#5c4618,#a87d25);color:#fff}.nav .section{font-size:10px;letter-spacing:.12em;color:#6e7885;padding:18px 12px 6px}.main{min-width:0;flex:1}.topbar{height:68px;position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#090b0eec;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.topbar h1{font:700 22px Georgia,serif;margin:0}.top-actions{display:flex;align-items:center;gap:10px}.admin-pill{border:1px solid #6b541e;border-radius:99px;padding:7px 11px;color:var(--gold2);font-size:11px}.content{padding:24px;max-width:1700px;margin:auto}.view{display:none}.view.active{display:block}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:4px 0 18px}.section-head h2{font:700 27px Georgia,serif;margin:5px 0}.section-head p{margin:0;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,.card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#141a20,#0a0d11);padding:16px}.metric label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;color:var(--gold2);font-size:25px;margin-top:8px}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card h3{font:700 17px Georgia,serif;color:var(--gold2);margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar .search{max-width:300px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:760px;background:#0b0e12}th,td{text-align:left;padding:11px;border-bottom:1px solid #232a31;font-size:12px;vertical-align:top}th{color:#8f98a4;font-size:10px;text-transform:uppercase;letter-spacing:.08em}tr:hover td{background:#11171e}.badge{display:inline-block;border:1px solid #40505d;border-radius:99px;padding:4px 8px;font-size:10px}.badge.ok{color:#7be1ad;border-color:#2e6b4a;background:#102319}.badge.warn{color:#f4d27e;border-color:#735d27;background:#251d0d}.badge.bad{color:#ffaaaa;border-color:#743b3b;background:#2a1111}.empty{padding:28px;text-align:center;color:var(--muted)}.chat-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px}.conversation{max-height:65vh;overflow:auto}.conversation button{width:100%;text-align:left;border:1px solid transparent;border-radius:9px;background:#0b0e12;color:var(--text);padding:12px;margin-bottom:7px}.conversation button:hover,.conversation button.active{border-color:#7a5b1e;background:#19150d}.conversation strong{display:block}.conversation small{color:var(--muted)}.chat-card{height:min(680px,calc(100vh - 190px));display:flex;flex-direction:column;min-height:0}.chat-head{padding:14px;border-bottom:1px solid var(--line);font-weight:800}.chat-messages{flex:1;min-height:0;overflow-y:auto;padding:14px;background:#080a0d}.chat-message{max-width:86%;margin:0 0 12px;padding:10px 12px;border:1px solid #27313b;border-radius:12px;background:#111820}.chat-message.admin{margin-left:auto;background:#241d0d;border-color:#715923}.chat-message small{display:block;color:var(--muted);margin-bottom:5px}.chat-compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chat-compose input{flex:1;min-width:0}.settings-form{max-width:720px}.settings-form .field{margin-bottom:12px}.switch{display:flex;align-items:center;gap:8px}.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:#000b}.modal.open{display:grid}.modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;border:1px solid #755a1d;border-radius:14px;background:#11161c;padding:22px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h3{font:700 22px Georgia,serif;color:var(--gold2);margin:0}.toast{position:fixed;right:18px;bottom:18px;display:none;z-index:30;max-width:360px;padding:12px 15px;border:1px solid #39684e;border-radius:9px;background:#122219;color:#c4f1d4}.loading{color:var(--muted);padding:28px;text-align:center}
@media(max-width:900px){.sidebar{width:205px;flex-basis:205px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.chat-layout{grid-template-columns:1fr}.conversation{max-height:260px}.chat-card{height:min(650px,calc(100vh - 300px))}}
@media(max-width:650px){.shell{display:block}.sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav .section{grid-column:1/-1;padding:8px 4px 2px}.content{padding:14px}.topbar{padding:0 14px}.topbar h1{font-size:17px}.admin-pill{display:none}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:20px}.section-head{display:block}.section-head .toolbar{margin-top:12px}}
</style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-card"><div class="brand">WZ MANAGE PRO · PLATFORM</div><h1>Admin Platform</h1><p>Kelola tenant, subscription, pembayaran, dan Obrolan Owner secara aman dan tenant-aware.</p><div class="form" style="margin-top:22px"><label class="field">Username Admin<input id="adminUsername" autocomplete="username" required></label><label class="field">Password<input id="adminPassword" type="password" autocomplete="current-password" required></label></div><div id="loginError" class="error" style="margin-top:12px"></div><button class="btn primary" style="width:100%;margin-top:16px" type="submit">MASUK ADMIN</button></form></section>
<div id="shell" class="shell hidden"><aside class="sidebar"><div class="brand">WZ MANAGE PRO<br><small style="color:#7f8995;letter-spacing:.08em">PLATFORM ADMIN</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="top-actions"><span class="admin-pill" id="adminName">Admin</span><button class="btn small" id="logoutButton">Keluar</button></div></header><div class="content" id="content"></div></main></div>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Detail</h3><button class="btn small" id="modalClose">Tutup</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const state={admin:null,view:'dashboard',search:'',status:'',plan:'',role:'',page:1,limit:25,selectedBusiness:null,messages:[],chatBusiness:null,refresh:null};
const menu=[['dashboard','Dashboard'],['businesses','Business'],['users','Owner / User'],['subscriptions','Subscription'],['plans','Paket'],['payments','Pembayaran'],['forum','Obrolan Owner'],['notifications','Notification'],['audit','Audit Log'],['settings','Pengaturan Sistem']];
const titles=Object.fromEntries(menu);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const textArea=value=>String(value??'').replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
const rupiah=value=>'Rp '+Number(value||0).toLocaleString('id-ID');
const date=value=>value?new Date(value).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.style.display='none',2800)}
function showLogin(message=''){document.getElementById('login').classList.remove('hidden');document.getElementById('shell').classList.add('hidden');const e=document.getElementById('loginError');e.textContent=message;e.classList.toggle('show',!!message)}
async function api(path,options={}){const res=await fetch('/api/'+path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await res.json().catch(()=>({}));if(res.status===401){showLogin(data.error||'Sesi Admin berakhir.');throw new Error(data.error||'Unauthorized')}if(!res.ok)throw new Error(data.error||'Permintaan gagal.');return data}
function nav(){document.getElementById('nav').innerHTML=menu.map(([key,label])=>`<button data-view="${key}" class="${state.view===key?'active':''}">${label}</button>`).join('')}
async function login(ev){ev.preventDefault();const btn=ev.submitter,err=document.getElementById('loginError');btn.disabled=true;err.classList.remove('show');try{const r=await api('admin/login',{method:'POST',body:JSON.stringify({username:document.getElementById('adminUsername').value.trim(),password:document.getElementById('adminPassword').value})});state.admin=r.admin;document.getElementById('adminPassword').value='';document.getElementById('login').classList.add('hidden');document.getElementById('shell').classList.remove('hidden');document.getElementById('adminName').textContent=r.admin.displayName||r.admin.username;boot()}catch(e){err.textContent=e.message;err.classList.add('show')}finally{btn.disabled=false}}
function logout(){api('admin/logout',{method:'POST'}).catch(()=>{}).finally(()=>{state.admin=null;clearInterval(state.refresh);showLogin()})}
function setView(view){state.view=view;state.page=1;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===`view-${view}`));nav();document.getElementById('pageTitle').textContent=titles[view]||'Admin';loadView(view)}
function toolbar(extra=''){return `<div class="toolbar"><input class="search" id="search" value="${esc(state.search)}" placeholder="Cari data..."><select class="search" id="statusFilter"><option value="">Semua status</option><option value="ACTIVE">Aktif</option><option value="TRIAL">Trial</option><option value="EXPIRED">Expired</option><option value="PENDING">Pending</option><option value="FAILED">Failed</option></select><select class="search" id="planFilter"><option value="">Semua paket</option><option value="TRIAL">Gratis</option><option value="PRO">Pro</option><option value="PRO_MAX">Pro Max</option></select><button class="btn small" id="searchButton">Terapkan</button>${extra}</div>`}
function bindToolbar(){document.getElementById('searchButton')?.addEventListener('click',()=>{state.search=document.getElementById('search').value.trim();state.status=document.getElementById('statusFilter').value;state.plan=document.getElementById('planFilter').value;state.page=1;loadView(state.view)});document.getElementById('statusFilter')?.addEventListener('change',()=>{state.status=document.getElementById('statusFilter').value;state.page=1;loadView(state.view)});document.getElementById('planFilter')?.addEventListener('change',()=>{state.plan=document.getElementById('planFilter').value;state.page=1;loadView(state.view)});document.getElementById('roleFilter')?.addEventListener('change',()=>{state.role=document.getElementById('roleFilter').value;state.page=1;loadView(state.view)})}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`}
function badge(value){const v=String(value||'').toUpperCase();const cls=['ACTIVE','PAID','A','OK'].includes(v)?'ok':['TRIAL','PENDING'].includes(v)?'warn':'bad';return `<span class="badge ${cls}">${esc(v||'-')}</span>`}
function pagination(data){return `<div class="toolbar" style="justify-content:flex-end"><span class="subtle">Halaman ${data.page} / ${data.pages||1} · ${data.total} data</span><button class="btn small" id="prevPage" ${data.page<=1?'disabled':''}>Sebelumnya</button><button class="btn small" id="nextPage" ${data.page>=data.pages?'disabled':''}>Berikutnya</button></div>`}
function bindPagination(data){document.getElementById('prevPage')?.addEventListener('click',()=>{state.page--;loadView(state.view)});document.getElementById('nextPage')?.addEventListener('click',()=>{state.page++;loadView(state.view)})}
function viewShell(id,html){document.getElementById('content').innerHTML=`<section id="view-${id}" class="view active">${html}</section>`;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===`view-${id}`))}
async function loadView(view){if(!state.admin)return;document.getElementById('content').innerHTML='<div class="loading">Memuat data Admin...</div>';try{if(view==='dashboard')return loadDashboard();if(view==='businesses')return loadBusinesses();if(view==='users')return loadUsers();if(view==='subscriptions')return loadSubscriptions();if(view==='plans')return loadPlans();if(view==='payments')return loadPayments();if(view==='forum')return loadForum();if(view==='notifications')return loadNotifications();if(view==='audit')return loadAudit();if(view==='settings')return loadSettings()}catch(e){document.getElementById('content').innerHTML=`<section class="view active"><div class="card"><h3>Gagal memuat</h3><p>${esc(e.message)}</p></div></section>`}}
async function loadDashboard(){const r=await api('admin/dashboard'),c=r.counts||{};const metric=(label,value)=>`<div class="metric"><label>${label}</label><strong>${value}</strong></div>`;viewShell('dashboard',`<div class="section-head"><div><div class="brand">PLATFORM OVERVIEW</div><h2>Dashboard</h2><p>Data real-time dari seluruh tenant WZ Manage Pro.</p></div><button class="btn small" id="refreshDashboard">Refresh</button></div><div class="metrics">${metric('Total Business',c.businesses||0)}${metric('Business Aktif',c.active_businesses||0)}${metric('Trial',c.trial_businesses||0)}${metric('Expired',c.expired_businesses||0)}${metric('Owner',c.owners||0)}${metric('User Aktif',c.users||0)}${metric('Cabang',c.branches||0)}${metric('Karyawan',c.employees||0)}${metric('Subscription Aktif',c.active_subscriptions||0)}${metric('Akan Expired',c.expiring_subscriptions||0)}${metric('Subscription Expired',c.expired_subscriptions||0)}${metric('Pendapatan Subscription',rupiah(c.subscription_revenue||0))}${metric('Payment Pending',c.pending_payments||0)}${metric('Payment Berhasil',c.successful_payments||0)}${metric('Payment Gagal',c.failed_payments||0)}</div><div class="grid two" style="margin-top:14px"><section class="card"><h3>Pertumbuhan Tenant</h3>${barChart(r.growth||[],'month','count')}</section><section class="card"><h3>Paket Digunakan</h3>${barChart(r.plans||[],'plan','count')}</section></div><section class="card" style="margin-top:14px"><h3>Perhatian Admin</h3>${table(['Business','Paket','Status','Berakhir'],(r.attention||[]).map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.id)}</small></td><td>${badge(x.plan)}</td><td>${badge(x.status)}</td><td>${date(x.currentPeriodEnd)}</td></tr>`))}</section>`);document.getElementById('refreshDashboard').onclick=loadDashboard}
function barChart(rows,label,value){const max=Math.max(...rows.map(x=>Number(x[value]||0)),1);return `<div style="display:grid;gap:9px">${rows.map(x=>`<div style="display:grid;grid-template-columns:100px 1fr 40px;gap:8px;align-items:center"><span>${esc(x[label])}</span><i style="height:9px;border-radius:99px;background:linear-gradient(90deg,#74551a,var(--gold2));width:${Math.max(3,Number(x[value]||0)/max*100)}%"></i><b>${esc(x[value])}</b></div>`).join('')||'<div class="empty">Data belum tersedia.</div>'}</div>`}
async function loadBusinesses(){const qs=new URLSearchParams({page:state.page,limit:state.limit,search:state.search,status:state.status,plan:state.plan});const r=await api('admin/businesses?'+qs);viewShell('businesses',`<div class="section-head"><div><div class="brand">TENANT MANAGEMENT</div><h2>Business</h2><p>${r.total} tenant ditemukan.</p></div></div>${toolbar()}${table(['Business','Owner','Paket','Status Subscription','Cabang','Karyawan','Aksi'],r.rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><small>${esc(x.id)}</small></td><td>${x.owners}</td><td>${badge(x.plan)}</td><td>${badge(x.subscriptionStatus)}</td><td>${x.branches}</td><td>${x.employees}</td><td><button class="btn small" data-action="business-detail" data-id="${esc(x.id)}">Detail</button></td></tr>`))}${pagination(r)}`);bindToolbar();bindPagination(r);document.querySelectorAll('[data-action="business-detail"]').forEach(btn=>btn.onclick=()=>showBusiness(btn.dataset.id))}
async function showBusiness(id){const r=await api('admin/businesses/'+encodeURIComponent(id));const b=r.business;openModal('Detail Business',`<div class="grid two"><div><p><b>Business ID:</b> ${esc(b.id)}</p><p><b>Nama:</b> ${esc(b.name)}</p><p><b>Status:</b> ${b.active?'Aktif':'Nonaktif'}</p><p><b>Dibuat:</b> ${date(b.createdAt)}</p></div><div><p><b>Paket:</b> ${badge(r.subscription?.plan)}</p><p><b>Status subscription:</b> ${badge(r.subscription?.status)}</p><p><b>Berlaku sampai:</b> ${date(r.subscription?.currentPeriodEnd)}</p></div></div><h3>Owner/User</h3>${table(['Nama','Username','Role','Status','Kontak'],r.owners.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${x.active?'Aktif':'Nonaktif'}</td><td>${esc(x.phone||x.email||'-')}</td></tr>`))}<h3 style="margin-top:18px">Cabang</h3>${table(['Nama','Alamat','Status'],r.branches.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.address||'-')}</td><td>${x.active?'Aktif':'Nonaktif'}</td></tr>`))}<h3 style="margin-top:18px">Karyawan</h3>${table(['Nama','Role','Cabang','Status'],r.employees.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${esc(r.branches.find(b=>b.id===x.branchId)?.name||'-')}</td><td>${x.active?'Aktif':'Nonaktif'}</td></tr>`))}`)}
async function loadUsers(){const qs=new URLSearchParams({page:state.page,limit:state.limit,search:state.search,status:state.status,role:state.role});const r=await api('admin/users?'+qs);viewShell('users',`<div class="section-head"><div><div class="brand">ACCOUNT MANAGEMENT</div><h2>Owner / User</h2><p>${r.total} akun tenant.</p></div></div>${toolbar(`<select class="search" id="roleFilter"><option value="">Semua role</option><option value="owner" ${state.role==='owner'?'selected':''}>Owner</option><option value="manager" ${state.role==='manager'?'selected':''}>Manager</option><option value="employee" ${state.role==='employee'?'selected':''}>Employee</option><option value="barber" ${state.role==='barber'?'selected':''}>Barber</option><option value="kasir" ${state.role==='kasir'?'selected':''}>Kasir</option></select>`)}${table(['User','Business','Role','Status','Subscription','Dibuat','Aktivitas','Aksi'],r.rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><small>${esc(x.username)}</small></td><td>${esc(x.businessName||x.businessId||'-')}</td><td>${esc(x.role)}</td><td>${badge(x.active?'ACTIVE':'SUSPENDED')}</td><td>${badge(x.plan)} ${badge(x.subscriptionStatus)}</td><td>${date(x.createdAt)}</td><td>${date(x.lastActivityAt)}</td><td><button class="btn small ${x.active?'danger':''}" data-user-status="${x.active?'suspend':'activate'}" data-id="${x.id}">${x.active?'Suspend':'Aktifkan'}</button></td></tr>`))}${pagination(r)}`);bindToolbar();bindPagination(r);document.querySelectorAll('[data-user-status]').forEach(btn=>btn.onclick=()=>changeUserStatus(btn.dataset.id,btn.dataset.userStatus))}
async function changeUserStatus(id,status){if(!confirmStatus(`Ubah status akun ini menjadi ${status==='suspend'?'SUSPENDED':'ACTIVE'}?`))return;try{await api('admin/users/'+id+'/status',{method:'POST',body:JSON.stringify({active:status==='activate'})});toast('Status akun diperbarui.');loadUsers()}catch(e){toast(e.message)}}
function confirmStatus(message){return window.confirm(message)}
async function loadSubscriptions(){const qs=new URLSearchParams({page:state.page,limit:state.limit,search:state.search,status:state.status,plan:state.plan});const r=await api('admin/subscriptions?'+qs);viewShell('subscriptions',`<div class="section-head"><div><div class="brand">SUBSCRIPTION OPERATIONS</div><h2>Subscription</h2><p>${r.total} subscription tenant.</p></div></div>${toolbar()}${table(['Business','Owner','Paket','Status','Mulai','Berakhir','Payment','Order'],r.rows.map(x=>`<tr><td><strong>${esc(x.businessName)}</strong><br><small>${esc(x.businessId)}</small></td><td>${esc(x.owner||'-')}</td><td>${badge(x.plan)}</td><td>${badge(x.subscriptionStatus||x.status)}</td><td>${date(x.currentPeriodStart)}</td><td>${date(x.currentPeriodEnd)}</td><td>${badge(x.paymentStatus)} ${rupiah(x.amount)}</td><td>${esc(x.orderId||'-')}</td></tr>`))}${pagination(r)}`);bindToolbar();bindPagination(r)}
async function loadPlans(){const r=await api('admin/plans');viewShell('plans',`<div class="section-head"><div><div class="brand">PACKAGE CATALOG</div><h2>Paket</h2><p>Konfigurasi sumber database untuk Trial, Pro, dan Pro Max.</p></div></div><div class="grid two">${r.plans.map(x=>`<section class="card"><h3>${badge(x.plan)}</h3><p>${x.plan==='TRIAL'?'Gratis':rupiah(x.priceMonthly)+' / bulan'}</p><p>Cabang: ${x.maxBranches==null?'Unlimited':x.maxBranches} · Karyawan: ${x.maxEmployees==null?'Unlimited':x.maxEmployees}</p><p>Status: ${x.active?'Aktif':'Nonaktif'}</p><button class="btn small" data-plan-edit="${x.plan}">Edit Paket</button></section>`).join('')}</div>`);document.querySelectorAll('[data-plan-edit]').forEach(btn=>btn.onclick=()=>editPlan(r.plans.find(x=>x.plan===btn.dataset.planEdit)))}
function editPlan(plan){openModal('Edit '+plan.plan,`<form id="planForm" class="settings-form"><div class="grid two"><label class="field">Harga bulanan<input id="pMonthly" type="number" min="0" value="${plan.priceMonthly}"></label><label class="field">Harga tahunan<input id="pYearly" type="number" min="0" value="${plan.priceYearly}"></label><label class="field">Maks cabang<input id="pBranches" type="number" min="0" value="${plan.maxBranches??''}"></label><label class="field">Maks karyawan<input id="pEmployees" type="number" min="0" value="${plan.maxEmployees??''}"></label></div><p class="subtle">Kosongkan batas untuk Unlimited. Perubahan akan masuk Audit Log.</p><button class="btn primary" type="submit">Simpan Paket</button></form>`);document.getElementById('planForm').onsubmit=async e=>{e.preventDefault();const branches=document.getElementById('pBranches').value,employees=document.getElementById('pEmployees').value;try{await api('admin/plans/'+encodeURIComponent(plan.plan),{method:'PATCH',body:JSON.stringify({priceMonthly:Number(document.getElementById('pMonthly').value),priceYearly:Number(document.getElementById('pYearly').value),maxBranches:branches===''?null:Number(branches),maxEmployees:employees===''?null:Number(employees)})});closeModal();toast('Paket diperbarui.');loadPlans()}catch(e){toast(e.message)}}}
async function loadPayments(){const qs=new URLSearchParams({page:state.page,limit:state.limit,search:state.search,status:state.status});const r=await api('admin/payments?'+qs);viewShell('payments',`<div class="section-head"><div><div class="brand">XENDIT MONITORING</div><h2>Pembayaran</h2><p>${r.total} order subscription.</p></div></div>${toolbar()}${table(['Order','Business','Paket','Nominal','Status','Provider','Reference','Dibuat','Dibayar'],r.rows.map(x=>`<tr><td>${esc(x.orderId)}</td><td>${esc(x.businessName)}</td><td>${badge(x.plan)}</td><td>${rupiah(x.amount)}</td><td>${badge(x.status)}</td><td>${esc(x.paymentProvider||'-')}</td><td>${esc(x.paymentReference||x.xenditPaymentId||'-')}</td><td>${date(x.createdAt)}</td><td>${date(x.paidAt)}</td></tr>`))}${pagination(r)}`);bindToolbar();bindPagination(r)}
async function loadForum(){const r=await api('admin/forum/messages?limit=200');viewShell('forum',`<div class="section-head"><div><div class="brand">OWNER COMMUNITY · GLOBAL</div><h2>Obrolan Owner</h2><p>Ruang komunikasi bersama untuk semua Owner. Balasan Admin terlihat oleh semua Owner.</p></div></div><div class="chat-layout"><section class="card chat-card" id="chatCard" style="grid-column:1/-1;max-width:900px;width:100%;margin:0 auto"><div class="chat-head">💬 Obrolan Owner — Semua Owner & Admin</div><div class="chat-messages" id="chatMessages">${r.messages.map(m=>`<div class="chat-message ${m.senderRole==='platform_admin'?'admin':''}"><small>${esc(m.senderName||'Owner')}${m.businessName?' · '+esc(m.businessName):''} · ${date(m.createdAt)}</small>${m.messageType==='sticker'?esc(m.stickerId):esc(m.message)}</div>`).join('')||'<div class="empty">Belum ada pesan.</div>'}</div><form class="chat-compose" id="chatForm"><input id="chatInput" placeholder="Tulis balasan untuk semua Owner..." maxlength="4000" required><button class="btn primary" type="submit">Kirim</button></form></section></div>`);const box=document.getElementById('chatMessages');box.scrollTop=box.scrollHeight;document.getElementById('chatForm').onsubmit=sendAdminMessage}
async function sendAdminMessage(e){e.preventDefault();const input=document.getElementById('chatInput');if(!input)return;const message=input.value.trim();if(!message)return;input.disabled=true;try{await api('admin/forum/messages',{method:'POST',body:JSON.stringify({message,messageType:'text'})});input.value='';await loadForum()}catch(e){toast(e.message)}finally{input.disabled=false}}
async function loadNotifications(){const r=await api('admin/notifications?limit=50');viewShell('notifications',`<div class="section-head"><div><div class="brand">PLATFORM EVENTS</div><h2>Notification</h2><p>${r.total} event platform.</p></div></div>${table(['Waktu','Jenis','Judul','Pesan','Business','Status'],r.rows.map(x=>`<tr><td>${date(x.createdAt)}</td><td>${esc(x.type)}</td><td><strong>${esc(x.title)}</strong></td><td>${esc(x.message)}</td><td>${esc(x.businessId||'Platform')}</td><td>${x.readAt?'Dibaca':`<button class="btn small" data-notification="${x.id}">Tandai dibaca</button>`}</td></tr>`))}`);document.querySelectorAll('[data-notification]').forEach(btn=>btn.onclick=async()=>{await api('admin/notifications/'+btn.dataset.notification+'/read',{method:'POST'});loadNotifications()})}
async function loadAudit(){const r=await api('admin/audit-logs?limit=50');viewShell('audit',`<div class="section-head"><div><div class="brand">SECURITY TRACE</div><h2>Audit Log</h2><p>${r.total} aktivitas Admin tercatat.</p></div></div>${table(['Waktu','Admin','Action','Target','Business','Metadata'],r.rows.map(x=>`<tr><td>${date(x.createdAt)}</td><td>${esc(x.adminName||x.admin||'System')}</td><td>${esc(x.action)}</td><td>${esc(x.targetType||'-')} ${esc(x.targetId||'')}</td><td>${esc(x.businessId||'-')}</td><td><code>${esc(JSON.stringify(x.metadata||{}))}</code></td></tr>`))}`)}
async function loadSettings(){const r=await api('admin/settings'),s=r.settings||{};viewShell('settings',`<div class="section-head"><div><div class="brand">GLOBAL CONFIGURATION</div><h2>Pengaturan Sistem</h2><p>Konfigurasi ini hanya berlaku untuk platform.</p></div></div><form id="settingsForm" class="card settings-form"><label class="field">Nama platform<input id="platformName" value="${esc(s.platform_name||'WZ MANAGE PRO')}"></label><label class="field switch"><input id="maintenanceMode" type="checkbox" ${s.maintenance_mode?'checked':''}> Maintenance mode</label><label class="field">Notification settings (JSON)<textarea id="notificationSettings" rows="5">${textArea(JSON.stringify(s.notification_settings||{},null,2))}</textarea></label><button class="btn primary">Simpan Pengaturan</button></form>`);document.getElementById('settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('admin/settings',{method:'PUT',body:JSON.stringify({settings:{platform_name:document.getElementById('platformName').value.trim(),maintenance_mode:document.getElementById('maintenanceMode').checked,notification_settings:JSON.parse(document.getElementById('notificationSettings').value||'{}')}})});toast('Pengaturan sistem disimpan.')}catch(e){toast(e.message)}}}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('loginForm').onsubmit=login;document.getElementById('logoutButton').onclick=logout;document.getElementById('modalClose').onclick=closeModal;document.getElementById('nav').onclick=e=>{const btn=e.target.closest('[data-view]');if(btn)setView(btn.dataset.view)};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function boot(){nav();setView('dashboard');clearInterval(state.refresh);state.refresh=setInterval(()=>{if(state.admin&&state.view==='dashboard'&&!document.getElementById('modal').classList.contains('open'))loadDashboard().catch(()=>{})},30000)}
api('admin/me').then(r=>{state.admin=r.admin;document.getElementById('login').classList.add('hidden');document.getElementById('shell').classList.remove('hidden');document.getElementById('adminName').textContent=r.admin.displayName||r.admin.username;boot()}).catch(()=>showLogin());
</script>
</body>
